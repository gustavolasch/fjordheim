<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vikings Game — Construa sua vila viking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1720;color:#f6ead2;font-family:'Nunito',system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;touch-action:none;display:block}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tilt{position:fixed;left:0;right:0;height:20%;pointer-events:none;backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px);display:none;z-index:1}
#tiltT{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
#tiltB{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
body.tilt-on .tilt{display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(5,10,20,.5));z-index:1}
.glass{background:rgba(26,18,10,.74);-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);border:1px solid rgba(255,225,170,.16);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,240,210,.07)}
.panel{background:linear-gradient(180deg,rgba(46,32,19,.94),rgba(25,17,10,.94));border:1px solid rgba(243,201,105,.3);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,235,190,.08)}
.hidden{display:none!important}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);display:flex;gap:5px;align-items:stretch;z-index:5}
#res{flex:1;min-width:0;display:flex;gap:3px;padding:4px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;border-radius:16px}
#res::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:3px;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.28);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;border:none;color:inherit;font-family:inherit}
.chip.bag{background:rgba(243,201,105,.14);cursor:pointer}
.chip.full{color:#ff9a8a;background:rgba(160,40,30,.35)}
.rbtn{flex:none;width:40px;border:none;color:#f6ead2;font:900 14px 'Nunito',system-ui,sans-serif;cursor:pointer;padding:0;border-radius:14px;display:flex;align-items:center;justify-content:center}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(92vw,430px);display:flex;gap:8px;align-items:center;padding:7px 6px 7px 11px;border-radius:14px;font:700 12.5px/1.3 'Nunito',system-ui,sans-serif;z-index:6;transition:opacity .3s,transform .3s;border-color:rgba(243,201,105,.38)}
#hint.off{opacity:0;transform:translate(-50%,-8px);pointer-events:none}
#hint .ic{color:#f3c969;font-size:15px}
#hint button{background:none;border:none;color:rgba(246,234,210,.6);font-size:15px;padding:2px 6px;cursor:pointer}
#raid{position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);left:50%;transform:translateX(-50%);background:#8e1f17;border:1px solid #ff9b84;color:#fff;font-weight:900;border-radius:999px;padding:6px 14px;z-index:5;animation:pulse .8s infinite alternate;cursor:pointer;white-space:nowrap;font-size:13px}
@keyframes pulse{to{background:#c2342a}}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none;width:min(92vw,420px)}
.toast{padding:6px 12px;font-weight:700;font-size:12.5px;line-height:1.3;text-align:center;animation:tin .25s ease-out;transition:opacity .4s;border-radius:12px}
.toast.bad{border-color:rgba(255,138,122,.6);background:rgba(80,20,12,.82)}
.toast.good{border-color:rgba(155,227,138,.55)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:5px;z-index:7;border-radius:22px}
#bar button{background:none;border:none;color:rgba(246,234,210,.7);width:62px;height:48px;border-radius:17px;font:800 10px 'Nunito',system-ui,sans-serif;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0;transition:background .2s,color .2s,transform .12s}
#bar button:active{transform:scale(.93)}
#bar button.on{background:linear-gradient(180deg,rgba(243,201,105,.3),rgba(243,201,105,.12));color:#f8d985;box-shadow:inset 0 0 0 1px rgba(243,201,105,.36)}
#sheet,#place{position:fixed;left:50%;width:min(calc(100vw - 16px),560px);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:6;border-radius:20px;transform:translate(-50%,18px);opacity:0;pointer-events:none;transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .18s}
#sheet.open,#place.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#sheet{max-height:min(54vh,480px);overflow-y:auto;padding:12px 12px 14px;touch-action:pan-y}
#sheet.bs{padding:4px 8px 10px;overflow:hidden}
#place{display:flex;align-items:center;gap:7px;padding:7px 8px}
#place img{width:46px;height:40px;flex:none;border-radius:8px;background:rgba(0,0,0,.25)}
#place .txt{flex:1;min-width:0;font-size:12px;line-height:1.25;opacity:.95}
#place .txt b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#place .ok{color:#9be38a}#place .err{color:#ff9a8a}
.grab{display:block;width:100%;height:16px;background:none;border:none;cursor:pointer;padding:0}
.grab::after{content:'';display:block;width:38px;height:4px;border-radius:4px;background:rgba(255,235,200,.32);margin:6px auto 0}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px;touch-action:pan-x}
.cats::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid transparent;color:rgba(246,234,210,.72);font:800 11.5px 'Nunito',system-ui,sans-serif;cursor:pointer;transition:background .2s,color .2s}
.cat svg.i{width:16px;height:16px}
.cat.on{background:rgba(243,201,105,.18);border-color:rgba(243,201,105,.42);color:#f8d985}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:1px}
.strip.grid{flex-wrap:wrap;max-height:36vh;overflow-y:auto;touch-action:pan-y}
.pc{flex:none;width:78px;background:rgba(0,0,0,.26);border:1px solid rgba(243,201,105,.13);border-radius:13px;padding:3px 3px 6px;color:inherit;font:inherit;text-align:center;cursor:pointer;transition:transform .12s,border-color .2s}
.pc:active{transform:scale(.95)}
.strip.grid .pc{width:calc((100% - 18px)/4)}
.pc img{width:100%;aspect-ratio:192/168;display:block}
.pc b{display:flex;align-items:center;justify-content:center;font-size:10.5px;line-height:1.1;min-height:24px;padding:0 1px}
.pc i{font-style:normal;font-size:10px;opacity:.92;display:block;white-space:nowrap}
.pc.sel{border-color:#f3c969;box-shadow:inset 0 0 0 1px #f3c969;background:rgba(243,201,105,.14)}
.pc.dis img{opacity:.55}
h2{font-family:'Cinzel',serif;font-size:17px;margin:0 0 4px;color:#f3c969;letter-spacing:.03em}
h4{font-family:'Cinzel',serif;color:#f3c969;font-size:13px;margin:12px 0 6px;letter-spacing:.03em}
.hint{font-size:12.5px;opacity:.82;margin:0 0 10px;line-height:1.35}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.x{background:none;border:none;color:#f6ead2;font-size:19px;cursor:pointer;padding:0 4px;line-height:1;opacity:.8}
.cost{font-size:11.5px;opacity:.92}
.no{color:#ff8a7a}
.gbtn{background:linear-gradient(#f3c969,#c9962f);color:#2a1a0a;border:none;border-radius:11px;padding:9px 14px;font:900 14px 'Nunito',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.gbtn:disabled{opacity:.4}
.sbtn{background:rgba(255,255,255,.07);color:#f6ead2;border:1px solid rgba(243,201,105,.25);border-radius:11px;padding:8px 11px;font:800 13px 'Nunito',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sbtn.on{background:rgba(243,201,105,.25);color:#f3c969}
.sbtn.red{border-color:#ff8a7a;color:#ffb0a3}
.sbtn:disabled{opacity:.4}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.meter{height:8px;background:rgba(0,0,0,.45);border-radius:9px;overflow:hidden;flex:1;min-width:80px}
.meter i{display:block;height:100%;background:#7bd36b;transition:width .3s}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:5px 2px;border-bottom:1px solid rgba(243,201,105,.1)}
.tbl td:last-child{text-align:right;font-weight:800}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:rgba(0,0,0,.25);border:1px solid rgba(243,201,105,.16);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px}
.item .ic{font-size:22px}
.item .top{display:flex;align-items:center;gap:8px}
.item .cnt{margin-left:auto;font-weight:900;font-size:17px;color:#f3c969}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{background:rgba(0,0,0,.28);border:1px solid rgba(243,201,105,.13);border-radius:12px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.slot span{font-size:19px}.slot b{font-size:15px}.slot small{font-size:9.5px;opacity:.7}
.slot.z{opacity:.4}
.small{font-size:11.5px;opacity:.85}
.queue{display:flex;gap:4px;flex-wrap:wrap;font-size:20px;min-height:26px}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,15,25,.25),rgba(5,8,14,.82));overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 12px calc(env(safe-area-inset-bottom,0px) + 24px);touch-action:pan-y}
.mbox{width:min(100%,560px);padding:22px 18px;text-align:center;margin:auto}
h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(36px,10vw,56px);letter-spacing:.08em;margin:0;color:#f3c969;text-shadow:0 3px 0 #6b4513,0 8px 24px rgba(0,0,0,.6)}
.sub{margin:4px 0 16px;opacity:.85;font-weight:700}
h3{font-family:'Cinzel',serif;color:#f3c969;font-size:15px;margin:18px 0 10px;letter-spacing:.04em}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{border-radius:14px;padding:12px;min-height:104px;text-align:left;cursor:pointer;border:1px solid rgba(255,255,255,.25);color:#fff;font:inherit;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.bcard b{font-family:'Cinzel',serif;font-size:15px}
.bcard span{font-size:12px;opacity:.95;line-height:1.25;margin-top:3px}
.mrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.opts{text-align:left;margin-top:6px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:700;font-size:14px;gap:10px}
.tg small{display:block;font-weight:600;opacity:.7;font-size:12px}
.sw{flex:none;width:48px;height:28px;border-radius:99px;background:#5a5048;position:relative;border:none;cursor:pointer}
.sw.on{background:#c9962f}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{left:24px}
.help{font-size:12px;opacity:.7;margin-top:16px;line-height:1.5}
#needs{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:4px 9px;border-radius:12px;z-index:6;pointer-events:none}
.nb{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:800}
.nb span{width:14px;text-align:center}
.nb .trk{width:36px;height:6px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
.nb .trk i{display:block;height:100%;background:#7bd36b;transition:width .3s}
.nb.low .trk i{background:#e2533f}
/* botão de bloqueio (0.5): segurar = bloquear com o escudo */
#bBlock{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:8;width:54px;height:54px;font-size:24px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
#bBlock.on{box-shadow:0 0 0 3px #f3c969}
</style>

<body>
<canvas id="c"></canvas>
<div id="tiltT" class="tilt"></div><div id="tiltB" class="tilt"></div>
<div id="vig"></div>
<div id="hud" class="hidden">
  <div id="top"><div id="res" class="glass"></div><button id="bLoc" class="rbtn glass" title="Encontrar personagem"></button><button id="bSpeed" class="rbtn glass" title="Velocidade">1×</button><button id="bMenu" class="rbtn glass" title="Menu"></button></div>
  <div id="hint" class="glass off"><span class="ic">💡</span><span id="hintT"></span><button id="hintX" aria-label="Dispensar">✕</button></div>
  <div id="raid" class="hidden"></div>
  <button id="bBlock" class="rbtn glass" title="Segure para bloquear">🛡️</button>
  <div id="toasts"></div>
  <div id="sheet" class="glass"></div>
  <div id="place" class="glass"></div>
  <nav id="bar" class="glass">
    <button data-tab="build"></button>
    <button data-tab="craft"></button>
    <button data-tab="bag"></button>
    <button data-tab="edit"></button>
  </nav>
</div>
<div id="menu">
  <div class="mbox panel">
    <h1>FJORDHEIM</h1>
    <p class="sub">Comece do nada. Construa tudo.</p>
    <div class="mrow" id="mTop"></div>
    <h3>Novo jogo · escolha o cenário</h3>
    <div class="bgrid" id="biomes"></div>
    <h3>Opções</h3>
    <div class="opts" id="opts"></div>
    <p class="help">Toque no chão para andar e nos objetos para coletar · arraste para mover a câmera · pinça ou roda do mouse para zoom</p>
  </div>
</div>
<script>
'use strict';
/* ================= Base ================= */
const HW=32,HH=16,N=68,SC=N/48,ZMIN=.32,ZMAX=3.2,SAVE_KEY='fjordheim_save_v2',SET_KEY='fjordheim_settings_v1',BAG=20;
const $=s=>document.querySelector(s);
const cv=$('#c');let ctx=cv.getContext('2d');
const lc=document.createElement('canvas'),lctx=lc.getContext('2d');
let W=0,H=0,DPR=1,bgGrad=null;
const isTouch=matchMedia('(pointer:coarse)').matches;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';lc.width=Math.ceil(W/2);lc.height=Math.ceil(H/2);bgGrad=null}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function makeNoise(seed){const r=mulberry32(seed),S=64,g=new Float32Array(S*S);for(let i=0;i<S*S;i++)g[i]=r();
  const at=(x,y)=>g[(((y%S)+S)%S)*S+(((x%S)+S)%S)],sm=t=>t*t*(3-2*t);
  function v(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi),a=at(xi,yi),b=at(xi+1,yi),c=at(xi,yi+1),d=at(xi+1,yi+1);return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf}
  return (x,y)=>{let s=0,amp=1,f=1,t=0;for(let o=0;o<4;o++){s+=v(x*f+o*17,y*f+o*31)*amp;t+=amp;amp*=.5;f*=2}return s/t}}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function rgbS(r,g,b,a){return a==null?`rgb(${r|0},${g|0},${b|0})`:`rgba(${r|0},${g|0},${b|0},${a})`}
const _sh=new Map();
function shade(hex,f){const k=hex+f;let v=_sh.get(k);if(v)return v;const[r,g,b]=hexRgb(hex);v=f>=0?rgbS(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f):rgbS(r*(1+f),g*(1+f),b*(1+f));_sh.set(k,v);return v}
function P(x,y,z){return[(x-y)*HW,(x+y)*HH-(z||0)]}
function pp(pts,fill,stroke,lw){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}}
function ln(a,b,col,lw){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=col;ctx.lineWidth=lw||1;ctx.stroke()}
function ell(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function lp(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
const pick=a=>a[(Math.random()*a.length)|0];
let perfT=0,LOD=false;
const ICON={
 build:'<path d="M14.5 5.5l4 4"/><path d="M13 4l2-2 6 6-2 2z"/><path d="M14 8l-9.5 9.5a1.5 1.5 0 0 0 2 2L16 10"/>',
 craft:'<path d="M4 20l9-9"/><path d="M12 4c3.5-.5 7 2.5 7.5 6l-3 .8-5.3-5.3z"/><path d="M15 13l5 5-2 2-5-5"/>',
 bag:'<path d="M5.5 9h13l-1 11h-11z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/><path d="M9.5 13h5"/>',
 edit:'<path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>',
 loc:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 struct:'<path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
 walls:'<path d="M4 20V8l2-3 2 3v12M10 20V8l2-3 2 3v12M16 20V8l2-3 2 3v12"/>',
 fences:'<path d="M5 20V6M12 20V6M19 20V6M3 10h18M3 15h18"/>',
 floors:'<path d="M3 14l9-5 9 5-9 5z"/><path d="M7.5 11.5l9 5M12 9l4.5 2.5"/>',
 doors:'<path d="M6 21V4.5A.5.5 0 0 1 6.5 4h11a.5.5 0 0 1 .5.5V21M3.5 21h17"/><path d="M14.5 12.5v1"/>',
 store:'<path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/>',

function storeCap(){let c=0;for(const b of G.bld)if(b.done&&BD[b.type].store)c+=BD[b.type].store;return c}

  const hk=[],hv=[];const push=(k,v)=>{hk.push(k);hv.push(v);let i=hk.length-1;while(i>0){const p=(i-1)>>1;if(hv[p]<=hv[i])break;[hk[p],hk[i]]=[hk[i],hk[p]];[hv[p],hv[i]]=[hv[i],hv[p]];i=p}};
  const pop=()=>{const k=hk[0],lk=hk.pop(),lv=hv.pop();if(hk.length){hk[0]=lk;hv[0]=lv;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<hk.length&&hv[l]<hv[m])m=l;if(r<hk.length&&hv[r]<hv[m])m=r;if(m===i)break;[hk[m],hk[i]]=[hk[i],hk[m]];[hv[m],hv[i]]=[hv[i],hv[m]];i=m}}return k};
  const h=(x,y)=>{const dx=Math.abs(x-hx),dy=Math.abs(y-hy);return Math.max(dx,dy)+.414*Math.min(dx,dy)};
  const s=idx(sx,sy);gS[s]=0;came[s]=-1;seen[s]=stamp;push(s,h(sx,sy));let it=0;
  while(hk.length&&it++<maxIt){const c=pop();if(closed[c]===stamp)continue;closed[c]=stamp;const cx=c%N,cy=(c/N)|0;
    if(goal(cx,cy)){const path=[];let k=c;while(k!==s&&k>=0){path.push([k%N,(k/N)|0]);k=came[k]}path.reverse();return path}
    for(const[dx,dy,dc]of DIRS){const nx=cx+dx,ny=cy+dy;const pc=pass(nx,ny);if(!pc)continue;if(dx&&dy&&(!pass(cx+dx,cy)||!pass(cx,cy+dy)))continue;
      const ni=idx(nx,ny);if(closed[ni]===stamp)continue;const ng=gS[c]+dc*pc;if(seen[ni]!==stamp||ng<gS[ni]){seen[ni]=stamp;gS[ni]=ng;came[ni]=c;push(ni,ng+h(nx,ny))}}}
  return null}
const nearRect=(rx,ry,rw,rh)=>(x,y)=>x>=rx-1&&x<=rx+rw&&y>=ry-1&&y<=ry+rh;
const inRect=(rx,ry,rw,rh)=>(x,y)=>x>=rx&&x<rx+rw&&y>=ry&&y<ry+rh;

  else{const[cx,cy]=utile(u);if((cx!==tx||cy!==ty)&&!passV(tx,ty)){u.path=null;u.moving=false;return false}}

  case'farm':{const b=BMAP.get(a.b);if(b){b.grow+=.15;for(let k=0;k<2;k++)puff(b.x+Math.random()*3,b.y+Math.random()*3,'dust');if(b.grow>=1){b.grow=0;const n=Math.min(4,Math.floor((BAG-bagW())/WEIGHT.food+1e-6));if(n>0){addInv('food',n,b.x+1.5,b.y+1.5);sfx('store')}else{bagFull();u.order=null}}}break}
  case'craft':case'forge':G.items[a.item]++;floater(u.x,u.y,`+1 ${ITEMS[a.item].ic}`);sfx('craft');if(o)o.done=true;u.order=null;if(a.item==='axe')completeHint('craft');if(a.item==='pick')completeHint('pick');break}}

/* ================= Hints (contextual, dismiss on completion) ================= */
let hintCur=null,hintAt=0;
function showHint(id,force){if(!G||G.demo||G.hints[id])return;if(hintCur===id)return;if(hintCur&&!force)return;hintCur=id;hintAt=perfT;$('#hintT').textContent=HINTS[id];$('#hint').classList.remove('off')}
function completeHint(id){if(!G)return;G.hints[id]=1;if(hintCur===id){hintCur=null;$('#hint').classList.add('off')}}
$('#hintX').addEventListener('click',()=>{if(hintCur)completeHint(hintCur)});
function hintChecks(){if(!G||G.demo||menuOpen)return;
  if(hintCur&&(hintCur==='night'||hintCur==='fence')&&perfT-hintAt>14)completeHint(hintCur);
  if(hintCur)return;
  if(!G.hints.walk)return showHint('walk');
  if(!G.hints.craft&&have('stick')>=2&&have('stone')>=2&&!G.items.axe)return showHint('craft');
  if(!G.hints.chop&&G.items.axe>0)return showHint('chop');
  if(!G.hints.shelter&&G.flags.deposited&&!G.bld.some(b=>b.type==='shelter'))return showHint('shelter');
  if(!G.hints.night&&darkness()>.25)return showHint('night')}

/* ================= Particles ================= */
function puff(x,y,type){if(PT.length>500)return;const r=Math.random;
  const p={type,x:x+(r()-.5)*.3,y:y+(r()-.5)*.3,z:4,vx:0,vy:0,vz:0,life:1,max:1,r:3,g:0};
  if(type==='smoke'){p.z=8+r()*10;p.vz=14+r()*8;p.vx=.15+r()*.1;p.vy=-.1;p.r=3+r()*3;p.life=p.max=2.5+r()*1.5}
  else if(type==='chimney'){p.type='smoke';p.vz=12+r()*5;p.vx=.12+windStrength()*.15;p.vy=-.1;p.r=2.5;p.life=p.max=3+r()}
  else if(type==='dust'){p.z=2;p.vz=6+r()*6;p.vx=(r()-.5)*.6;p.vy=(r()-.5)*.6;p.r=2+r()*3;p.life=p.max=1+r()*.6}
  else if(type==='leaf'){p.z=16+r()*20;p.vz=-4;p.g=8;p.vx=(r()-.3)*.8;p.vy=(r()-.5)*.6;p.r=1.8+r();p.life=p.max=1.4+r();p.c=pick(G&&G.biome==='autumn'?BIO.leaves:BIO.pines)}
  else if(type==='pop'){p.z=10;p.vz=24+r()*10;p.vx=(r()-.5)*.8;p.vy=(r()-.5)*.8;p.life=p.max=.5}
  else if(type==='ring'){p.z=0;p.life=p.max=.6}
  else if(type==='chip'||type==='rockchip'||type==='debris'||type==='blood'||type==='spark'){p.z=8+r()*6;p.vz=20+r()*25;p.g=90;p.vx=(r()-.5)*1.6;p.vy=(r()-.5)*1.6;p.r=1.4+r();p.life=p.max=.6+r()*.4}
  else if(type==='fire'){p.z=6+r()*10;p.vz=18+r()*10;p.r=2+r()*2.5;p.life=p.max=.5+r()*.4}
  PT.push(p)}
function floater(x,y,text){PT.push({type:'txt',x,y,z:26,vz:16,vx:0,vy:0,life:1.5,max:1.5,text,g:0})}
function fishJump(x,y){PT.push({type:'fish',x,y,z:0,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,vz:0,life:.9,max:.9,g:0,c:Math.random()<.5});for(let k=0;k<4;k++)PT.push({type:'splash',x,y,z:1,vx:(Math.random()-.5),vy:(Math.random()-.5),vz:20+Math.random()*15,g:80,life:.5,max:.5,r:1.3})}
function updParticles(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt;if(p.life<=0){PT.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.g){p.vz-=p.g*dt;if(p.z<0){p.z=0;p.vz*=-.3;p.vx*=.5;p.vy*=.5}}if(p.type==='smoke')p.r+=dt*3.5}
  for(let i=AR.length-1;i>=0;i--){const a=AR[i],t=UMAP.get(a.tid);if(!t){AR.splice(i,1);continue}const dx=t.x-a.x,dy=t.y-a.y,d=Math.hypot(dx,dy);a.ang=Math.atan2((dx+dy)*HH,(dx-dy)*HW);
    if(d<.3){dmgUnit(t,a.dmg,a.tipo,{efeito:a.efeito||[],src:UMAP.get(a.src)});AR.splice(i,1);continue}const s=a.sp*dt;a.x+=dx/d*s;a.y+=dy/d*s;a.z=lerp(a.z,10,.1)}}

/* ================= Update ================= */
function update(dt){G.t+=dt;
  const pop=popCount();G.foodAcc=(G.foodAcc||0)+pop*dt/32;while(G.foodAcc>=1){G.foodAcc--;if(G.res.food>0)G.res.food--}
  // raids only once there is a real village to defend (Casa Comunal + inhabitants)
  if(settings.raids&&!G.demo&&longhouse()&&pop>0){if(!G.raidOn&&!G.raidWarned&&G.t>=G.nextRaid-25){G.raidWarned=true;toast('🔭 Invasores avistados! Chegam em 25 segundos.','bad')}
    if(G.t>=G.nextRaid&&!G.raidOn){G.raidWarned=false;G.nextRaid=G.t+260+Math.random()*90;spawnRaid()}}
  else G.nextRaid=Math.max(G.nextRaid,G.t+300);
  for(const u of G.units.slice()){if(!UMAP.has(u.id))continue;sangueTick(u,dt);if((u.stun||0)>0){u.stun-=dt;u.moving=false;continue}
    if(u.kind==='player')updPlayer(u,dt);else if(u.kind==='villager')updVillager(u,dt);else if(u.kind==='warrior')updWarrior(u,dt);else if(u.kind==='animal')updAnimal(u,dt);else updRaider(u,dt);
    if(u.moving||(u.act&&u.act.type!=='idle'&&u.act.type!=='wait'))u.anim+=dt*10;if(u.swing>0)u.swing-=dt}
  for(const b of G.bld.slice()){if(!BMAP.has(b.id))continue;if(b.pop>0)b.pop-=dt;if(queimaTick(b,dt))continue;if(!b.done)continue;
    if(b.type==='tower'){b.cd-=dt;if(b.cd<=0){const t=nearestUnit(b.x+.5,b.y+.5,CB.torre.alcance,v=>v.kind==='raider');if(t){b.cd=CB.torre.recarga;AR.push({x:b.x+.5,y:b.y+.5,z:46,tid:t.id,dmg:CB.torre.dano,tipo:CB.torre.tipo,sp:10})}else b.cd=.3}}
    b.smokeT-=dt;if(b.smokeT<=0){b.smokeT=.6+Math.random()*.6;const c=chimney(b);if(c){puff(c[0],c[1],'chimney');const p=PT[PT.length-1];if(p)p.z=c[2]}}
    if(b.hp<b.max*.45&&Math.random()<dt*6)puff(b.x+Math.random()*b.w,b.y+Math.random()*b.h,Math.random()<.5?'fire':'smoke')}
  updFalling(dt);animaisTick(dt);
  for(let k=G.regrow.length-1;k>=0;k--){const i=G.regrow[k],o=G.obj[i];if(!o||G.occ[i]){G.regrow.splice(k,1);continue}
    if(o.t==='stump'){o.timer-=dt;if(o.timer<=0)G.obj[i]={t:'tree',k:o.k,c:o.c,ox:o.ox,oy:o.oy,s:o.s,hp:5,g:.2}}
    else if(o.t==='tree'){o.g=Math.min(1,o.g+dt/150);if(o.g>=1)G.regrow.splice(k,1)}
    else if(o.t==='bush'){o.rt=(o.rt||0)+dt;if(o.rt>100){o.rt=0;o.b++}if(o.b>=3){o.tr=0;G.regrow.splice(k,1)}}
    else G.regrow.splice(k,1)}
  // branches slowly drop from trees again (no instant respawn)
  G.brT=(G.brT||0)+dt;if(G.brT>30){G.brT=0;let n=0;for(let i=0;i<N*N;i++)if(G.obj[i]&&G.obj[i].t==='branch')n++;
    if(n<N*N*.02)for(let k=0;k<40;k++){const i=(Math.random()*N*N)|0,o=G.obj[i];if(!o||o.t!=='tree'||o.g<1)continue;const x=i%N+((Math.random()*3|0)-1),y=(i/N|0)+((Math.random()*3|0)-1);if(!inb(x,y))continue;const j=idx(x,y);if(G.obj[j]||G.occ[j]||!landT(G.tiles[j]))continue;G.obj[j]=BRANCH(Math.random);break}}
  for(const d of G.decor)if(d.k==='campfire'&&Math.random()<dt*1.2){puff(d.x,d.y,'chimney');const p=PT[PT.length-1];if(p)p.z=10*d.s}
  for(const o of G.obj)if(o&&o.shake>0)o.shake-=dt;
  if(Math.random()<dt*.4){const x=(Math.random()*N)|0,y=(Math.random()*N)|0;if(G.tiles[idx(x,y)]<=1&&!G.occ[idx(x,y)])fishJump(x+.5,y+.5)}
  updParticles(dt);
  if(!G.demo){G.saveT=(G.saveT||0)+dt;if(G.saveT>60){G.saveT=0;save(true)}}}
function chimney(b){switch(b.type){case'longhouse':return[b.x+1.5,b.y+1.5,42];case'house':return[b.x+1,b.y+1,30];case'smithy':return[b.x+.45,b.y+.45,34];case'shelter':return[b.x+1.2,b.y+2.05,6];default:return null}}

/* ================= Sobrevivência (0.4): fome, calor, energia, vida, morte e túmulo =================
   Barras do jogador (0..100): food (fome), warm (calor), energy (energia). Vida = u.hp.
   Fome: come sozinho abaixo de 35 e avisa quando a comida acaba. Morte: perde só a mochila (vai pro túmulo). */
const NEED_DEF={food:80,warm:100,energy:100};
const NEED_NAMES={hp:'Vida',food:'Fome',warm:'Calor',energy:'Energia',stam:'Fôlego'};
const WARN_GAP=60; // segundos de jogo entre avisos repetidos

function calmF(){return settings.calm?.5:1}
function nightDark(t){const ph=(t/240)%1,n=.5-.5*Math.cos(ph*6.283);return clamp((n-.62)/.3,0,1)*.62}
function foodStock(){return G.inv.food+G.res.food}
function isHeatNear(u){
  for(const d of G.decor)if(d.k==='campfire'&&Math.hypot(d.x-u.x,d.y-u.y)<3)return true;
  for(const b of G.bld){if(!b.done||!['house','longhouse','shelter','smithy'].includes(b.type))continue;if(Math.hypot(b.x+b.w/2-u.x,b.y+b.h/2-u.y)<3)return true}
  return false}
function nearWater(u){const x=Math.floor(u.x),y=Math.floor(u.y);for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(inb(x+dx,y+dy)&&G.tiles[idx(x+dx,y+dy)]<=1)return true;return false}
// frio: noite (se o ciclo dia/noite estiver ligado), Costa Gelada e água por perto
function coldLevel(u){let c=0;if(settings.daynight&&nightDark(G.t)>0)c=1;else if(BIO.snowy)c=.6;if(BIO.snowy&&settings.daynight&&nightDark(G.t)>0)c=1;if(nearWater(u))c+=.3;return Math.min(1,c)}
// velocidade cai com energia ou calor zerados
function survivalSpeed(u){return(u.energy<20?.7:1)*(u.warm<=0?.8:1)}

function needsTick(u,dt){
  if(u.hp<=0){killPlayer(u);return}
  if(u.food==null)Object.assign(u,{food:NEED_DEF.food,warm:NEED_DEF.warm,energy:NEED_DEF.energy});
  const k=calmF(),acting=u.act&&u.act.type!=='idle'&&u.act.type!=='wait';
  u.food=Math.max(0,u.food-dt*(100/480)*k*(acting?1.5:1));                 // ~8 min sem comer; trabalho pesado 1.5x
  u.energy=Math.max(0,u.energy-dt*(100/600)*(acting?1.6:u.moving?1.1:1));  // ~10 min acordado; esforço 1.6x
  u.warm=clamp(u.warm-dt*coldLevel(u)*(100/300)*k+(isHeatNear(u)?dt*15:0),0,100);
  if(u.food<=0||u.warm<=0){if(!DEV.god)u.hp=Math.max(0,u.hp-dt*(100/200)*k)} // fome ou frio zerados: vida cai devagar
  else if(u.hp<u.max)u.hp=Math.min(u.max,u.hp+dt*1.5);
  eatIfNeeded(u);
  needWarn(u);
}
function eatIfNeeded(u){
  if(u.food>=35||foodStock()<=0)return;
  if(G.inv.food>0)G.inv.food--;else G.res.food--;
  u.food=Math.min(100,u.food+30);
  toast('🍓 Você comeu','good');
}
function needWarn(u){
  if(!u.warnT)u.warnT={};
  const w=(key,cond,msg)=>{if(!cond)return;if(u.warnT[key]==null||G.t-u.warnT[key]>WARN_GAP){u.warnT[key]=G.t;toast(msg,'bad')}};
  w('food',u.food<35&&foodStock()<=0,'🍓 Acabou a comida! Colha frutinhas, pesque ou plante uma lavoura.');
  w('warm',u.warm<25,'🔥 Frio! Chegue perto de uma fogueira ou casa.');
  w('energy',u.energy<20,'⚡ Cansado! Durma numa cama para recuperar a energia.');
  w('hp',u.hp<30,'❤️ Vida baixa!');
}

// morte: a mochila (recursos e ferramentas) vai para um túmulo no local; o equipamento não é perdido
function killPlayer(u){
  if(!settings.calm){
    G.tombs.push({id:G.idc++,x:u.x,y:u.y,inv:{...G.inv},items:{...G.items}});
    for(const k in G.inv)G.inv[k]=0;
    for(const k in G.items)G.items[k]=0;
    toast('💀 Você morreu. Sua mochila ficou no túmulo.','bad');
  }else toast('💀 Você morreu. Modo tranquilo: nada foi perdido.','bad');
  respawnPlayer(u);
}
function respawnPlayer(u){
  u.hp=u.max;u.food=Math.max(u.food||0,50);u.warm=Math.max(u.warm||0,60);u.energy=Math.max(u.energy||0,60);
  u.act=null;u.order=null;u.path=null;u.moving=false;u.warnT={};u.sangue=0;u.stun=0;u.blockOn=false;
  const s=G.bld.find(b=>b.done&&(b.type==='shelter'||b.type==='house'||b.type==='longhouse'));
  const p=s?freeNear(s.x+1,s.y+s.h,3):freeNear(G.start[0],G.start[1],3);
  if(p){u.x=p[0]+.5;u.y=p[1]+.5}
}
// túmulo: tocar e resgatar devolve a mochila inteira
function tombAt(wx,wy){for(const t of G.tombs)if(Math.hypot(wx-t.x,wy-t.y)<.7)return t;return null}
function lootTomb(t){
  for(const k in t.inv)G.inv[k]=(G.inv[k]||0)+t.inv[k];
  for(const k in t.items)G.items[k]=(G.items[k]||0)+t.items[k];
  G.tombs=G.tombs.filter(x=>x!==t);
  toast('🎒 Você pegou sua mochila de volta','good');
}
function drawTomb(t){const q=P(t.x,t.y);
  ell(q[0],q[1]+1,11,4.5,'rgba(0,0,0,.25)');
  for(let k=0;k<7;k++){const a=k/7*6.283;ell(q[0]+Math.cos(a)*7,q[1]-2+Math.sin(a)*3.4,2.6,2,k%2?'#8a8680':'#a5a19a')}
  ell(q[0],q[1]-4,5,3,'#6f6c66');
  ln([q[0],q[1]-4],[q[0],q[1]-22],C.woodD,2.2);ln([q[0]-5,q[1]-17],[q[0]+5,q[1]-17],C.woodD,2);
  const w=Math.sin(perfT*3)*1.5;pp([[q[0],q[1]-22],[q[0]+8+w,q[1]-20],[q[0],q[1]-17]],'#c8243a')}

// dormir numa cama: passa a noite (até o amanhecer) e enche a energia
function sleepNight(u){
  let delta=60;
  if(settings.daynight&&nightDark(G.t)>0){delta=0;while(nightDark(G.t+delta)>0&&delta<400)delta++}
  G.t+=delta;
  u.food=Math.max(0,u.food-delta*(100/480)*.5*calmF());
  u.energy=100;u.warm=Math.max(u.warm,60);
  toast('🛏 Você dormiu até o amanhecer','good');
}

// barras na tela (fora do topo, acima da barra de navegação)
function needsHUD(){const p=PL();if(!p||p.food==null)return;
  const bars=[['❤️','hp',p.hp/p.max],['🍓','food',p.food/100],['🔥','warm',p.warm/100],['⚡','energy',p.energy/100],['💨','stam',(p.stam??100)/100]];
  const sig=bars.map(b=>Math.round(b[2]*20)).join(',');
  let el=document.getElementById('needs');
  if(!el){el=document.createElement('div');el.id='needs';el.className='glass';document.body.appendChild(el)}
  if(el.dataset.sig===sig)return;el.dataset.sig=sig;
  el.innerHTML=bars.map(([ic,k,v])=>`<div class="nb ${v<.3?'low':''}" title="${NEED_NAMES[k]}"><span>${ic}</span><div class="trk"><i style="width:${Math.max(0,Math.min(100,v*100)).toFixed(0)}%"></i></div></div>`).join('')}
/* ================= Combate (0.5) =================
   Armas e armaduras vêm de data/combate.json (CDATA). A simulação não sabe de tela: só recebe comandos
   (atacar, bloquear, reparar, tocar o sino) e muda o estado. Quatro tipos de dano: corte, perfuração,
   impacto e fogo. Fôlego, bloqueio, sangramento e atordoamento. Caça (animais), saqueadores que
   quebram construções, reparo, armadilha de estacas e sino de alarme. */
const CB=CDATA;
const SLOTS=CB.slots;
const ANIMAIS=CB.animais;

// Semente própria do combate (estado em G.rs, salvo no save): mesmos bichos e invasões em todo teste.
function rnd(){G.rs=(G.rs+0x6D2B79F5)|0;let t=Math.imul(G.rs^(G.rs>>>15),1|G.rs);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
function emptyEquip(){const e={};for(const s of SLOTS)e[s]=null;return e}
function zerosRes(){const o={};for(const k in RES)o[k]=0;return o}
function zerosItems(){const o={};for(const k in ITEMS)o[k]=0;return o}

/* ---- equipamento: 8 espaços. Item equipado sai da mochila (e não pesa nela). ---- */
function equipped(k){return SLOTS.some(s=>G.equip[s]===k)}
function hasTool(k){return(G.items[k]||0)>0||equipped(k)}
function gastaFerramenta(k){if(G.items[k]>0){G.items[k]--;return}const s=SLOTS.find(s=>G.equip[s]===k);if(s)G.equip[s]=null}
function equipItem(k){const it=ITEMS[k];
  if(!it||!it.slot){toast('Isto não se veste','bad');return}
  if(!G.items[k])return;
  const s=it.slot;
  if(s==='mao'&&it.duas_maos&&G.equip.escudo){toast('Arma de duas mãos: tire o escudo antes','bad');return}
  if(s==='escudo'&&G.equip.mao&&ITEMS[G.equip.mao].duas_maos){toast('Tire a arma de duas mãos antes','bad');return}
  if(G.equip[s])G.items[G.equip[s]]++; // troca: o que estava no espaço volta para a mochila
  G.equip[s]=k;G.items[k]--;sfx('craft');toast(`${it.ic} ${it.n} equipado`,'good')}
function unequip(s){const k=G.equip[s];if(!k)return;G.equip[s]=null;G.items[k]=(G.items[k]||0)+1;sfx('tick')}
function armaDe(u){const k=u.kind==='player'?G.equip.mao:null,it=k&&ITEMS[k];return it&&it.arma?{...it.arma,k}:{...CB.fol.mao_nua}}

/* ---- fôlego (0..100): atacar gasta no golpe, andar gasta pouco, bloquear gasta por segundo ---- */
function folTick(u,dt){if(u.stam==null)u.stam=CB.fol.max;
  let r=CB.fol.regen_parado;
  if(u.blockOn&&u.stam>0)r=-CB.fol.gasto_bloqueio;else if(u.moving)r=-CB.fol.gasto_andando;
  u.stam=clamp(u.stam+r*dt,0,CB.fol.max)}

/* ---- armadura: multiplica o dano pelo tipo (fator 1 = sem proteção) ---- */
function fatorArmadura(t,tipo){
  if(t.kind!=='player')return t.fator?(t.fator[tipo]??1):1;
  let f=1;for(const s of['cabeca','peito','pernas','pes']){const k=G.equip[s];if(k&&ITEMS[k].fator)f*=ITEMS[k].fator[tipo]??1}
  return Math.max(.12,f)}
/* ---- bloqueio: só o jogador segura o botão; precisa de fôlego e de escudo ou arma que bloqueia ---- */
function bloqueando(t){return!!(t.kind==='player'&&t.blockOn&&(t.stam||0)>0&&!((t.quebraT||0)>G.t))}
function fracaoBloqueio(atq){
  const e=G.equip,esc=e.escudo?ITEMS[e.escudo]:null,mao=e.mao?ITEMS[e.mao]:null;
  let f=esc?esc.bloqueio:(mao&&mao.arma&&(mao.arma.efeito||[]).includes('pode_bloquear')?CB.bloqueio_espada:CB.bloqueio_sem_escudo);
  if(atq&&(atq.efeito||[]).includes('ignora_escudo'))f*=CB.bloqueio_ignorado_por_lanca;
  return f}

/* ---- golpe: d = dano base · tipo = corte|perfuracao|impacto|fogo · atq = {efeito:[...], src:quem bateu} ---- */
function dmgUnit(t,d,tipo,atq){
  if(DEV.god&&t.kind==='player')return;
  tipo=tipo||'corte';const efe=(atq&&atq.efeito)||[];
  let v=d*fatorArmadura(t,tipo);
  if(efe.includes('quebra'))v=d*Math.sqrt(fatorArmadura(t,tipo)); // martelo de guerra: quebra parte da armadura
  if(bloqueando(t)){
    v*=1-fracaoBloqueio(atq);t.stam=Math.max(0,t.stam-v*CB.fol.custo_bloqueio_por_dano);
    if(tipo==='impacto'||efe.includes('puxa_escudo')){t.quebraT=G.t+CB.escudo_quebrado_segundos;toast('🛡️ Escudo quebrado!','bad');sfx('bad')}
  }
  if(tipo==='impacto'&&(d>=CB.atordoar_dano||efe.includes('atordoa')||efe.includes('quebra')))t.stun=Math.max(t.stun||0,CB.atordoar_segundos);
  if((tipo==='corte'||tipo==='perfuracao')&&rnd()<CB.sangramento.chance)sangra(t);
  if(t.kind==='animal'){const A=ANIMAIS[t.sp];
    if(A.comportamento==='foge'){t.fleeT=G.t+5;t.target=null}
    else if(atq&&atq.src&&atq.src.kind==='player')t.target=atq.src.id}
  t.hp-=v;for(let k=0;k<3;k++)puff(t.x,t.y,'blood');
  if(t.kind==='player'){if(t.hp<=0)killPlayer(t);return}
  if(t.hp<=0)killUnit(t)}
function sangra(t){
  if(t.kind==='player'&&G.inv.fibra>0){G.inv.fibra--;toast('🧵 Curativo de fibra estancou o sangue','good');return}
  if(t.kind==='player')toast('🩸 Sangramento! Use fibra para estancar.','bad');
  t.sangue=CB.sangramento.segundos}
function sangueTick(u,dt){if(!(u.sangue>0))return;
  if(u.kind==='player'&&G.inv.fibra>0){G.inv.fibra--;u.sangue=0;toast('🧵 Você estancou o sangramento','good');return}
  u.sangue-=dt;u.hp-=CB.sangramento.dps*dt;
  if(u.hp<=0){if(u.kind==='player')killPlayer(u);else killUnit(u)}}

/* ---- morte de unidades (inimigos, animais) e drops ---- */
function killUnit(u){for(let k=0;k<8;k++)puff(u.x,u.y,'smoke');removeUnit(u);
  if(u.kind==='raider'){if(!raidActive()&&G.raidOn){G.raidOn=false;const iron=3+G.raidN*2;addInv('iron',iron);toast(`🏆 Invasores derrotados! Deixaram 🔩${iron}`,'good')}}
  else if(u.kind==='animal'){const A=ANIMAIS[u.sp],txt=[];
    for(const k in A.drop){const n=A.drop[k];if(!(n>0))continue;
      if(canCarry(k,n)){addInv(k,n,u.x,u.y);txt.push(RES[k][0]+n)}
      else toast(`🎒 Mochila cheia: ${RES[k][1].toLowerCase()} ficou no chão`,'bad')}
    toast(`${A.ic} ${A.n} abatido${txt.length?' · '+txt.join(' '):''}`,'good');sfx('pick')}
  else toast(`💀 ${u.name} caiu em combate`,'bad')}

/* ---- ataque do jogador: ordem 'attack'. Retorna true quando usou o quadro (andar ou golpear). ---- */
function ataqueOrdem(u,o,dt){
  const t=UMAP.get(o.uid);
  if(!t||t.hidden||t.hp<=0){u.order=null;return false}
  const d=Math.hypot(t.x-u.x,t.y-u.y);
  if(d>25){u.order=null;toast('Ele fugiu. Caçada cancelada.');return false}
  const W=armaDe(u),proj=!!W.dist&&d>W.alcance,alc=proj?W.dist:W.alcance;
  if(d>alc){
    o.rt=(o.rt||0)-dt;
    if(!u.path||!u.path.length||o.rt<=0){o.rt=.4;const[tx,ty]=utile(t);
      const p=astar(...utile(u),(x,y)=>Math.hypot(x+.5-t.x,y+.5-t.y)<=alc*.9,tx,ty,passV,4000);
      if(p)u.path=p;else{u.order=null;toast('Não dá para chegar lá','bad');return false}}
    moveUnit(u,dt);return true}
  u.path=null;u.moving=false;faceTo(u,t.x,t.y);
  if((u.atkCd||0)>0)return true;
  const forte=!!o.heavy,custo=forte?CB.fol.golpe_forte:(W.fol||12);
  if((u.stam||0)<custo){if(!o.semFolego){toast('Sem fôlego. Espere um instante.','bad');o.semFolego=true}u.atkCd=.4;return true}
  o.semFolego=false;
  if(W.municao==='stone'){if(G.inv.stone<=0){toast('Sem pedrinhas para a funda','bad');u.order=null;return false}G.inv.stone--}
  u.stam-=custo;u.swing=.3;o.heavy=false;
  u.atkCd=(W.vel||1)*(forte?CB.fol.golpe_forte_mult_vel:1);
  const dano=W.dmg*(forte?CB.fol.golpe_forte_mult_dano:1);
  if(proj)AR.push({x:u.x,y:u.y,z:14,tid:t.id,dmg:dano,tipo:W.dano,sp:10,efeito:W.efeito||[],src:u.id});
  else dmgUnit(t,dano,W.dano,{efeito:W.efeito||[],src:u});
  return true}

/* ---- reparo: pede material proporcional ao dano e gasta tempo; o reparo aparece na barra da obra ---- */
function repCusto(b){const d=BD[b.type],f=(b.max-b.hp)/b.max,c={};
  for(const k in d.cost){const v=Math.ceil(d.cost[k]*f*CB.reparo.fracao_custo);if(v>0)c[k]=v}return c}
function reparaOrdem(u,o){const b=BMAP.get(o.b);
  if(!b||!b.done||b.hp>=b.max){u.order=null;return}
  if(!isNear(u,b)){if(!stepTo(u,o,b.x,b.y,b.w,b.h))b.unr=G.t+15;return}
  if(o.started)return;
  const c=repCusto(b);if(!afford(c)){toast('Faltam materiais para reparar','bad');u.order=null;return}
  pay(c);o.started=true;faceTo(u,b.x+b.w/2,b.y+b.h/2);
  u.act={type:'repair',b:b.id,t:0,dur:Math.max(1.5,CB.reparo.tempo_total*(b.max-b.hp)/b.max)}}

/* ---- construções: material resiste de forma diferente; fogo queima madeira ---- */
function matOf(type){return CB.material_construcao[type]||'madeira'}
function damageB(b,d,tipo){tipo=tipo||'corte';
  const f=CB.materiais[matOf(b.type)][tipo]??1;b.hp-=d*f;
  puff(b.x+Math.random()*b.w,b.y+Math.random()*b.h,'debris');
  if(tipo==='fogo'&&matOf(b.type)==='madeira'&&b.done)b.burn=CB.queima.segundos;
  if(b.type==='longhouse'&&b.hp<=b.max*.1){sack();b.hp=Math.round(b.max*.3);return}
  if(b.hp<=0)destroyB(b,`🔥 ${BD[b.type].n} foi destruído!`)}
function queimaTick(b,dt){if(!(b.burn>0))return false;
  b.burn-=dt;b.hp-=CB.queima.dano_por_segundo*dt;
  if(Math.random()<dt*5)puff(b.x+Math.random()*b.w,b.y+Math.random()*b.h,'fire');
  if(b.hp<=0){destroyB(b,`🔥 ${BD[b.type].n} queimou`);return true}
  return false}

/* ---- armadilha de estacas: o invasor que pisa leva um golpe e ela recarrega ---- */
function armadilhaCheck(u,tx,ty){const b=bAt(tx,ty);if(!b||b.type!=='trap'||!b.done||(b.disp||0)>G.t)return;
  const A=CB.armadilha;b.disp=G.t+A.recarga;b.hp-=A.desgaste;
  dmgUnit(u,A.dano,A.tipo,{efeito:[],src:null});for(let k=0;k<4;k++)puff(tx+.5,ty+.5,'rockchip');
  if(b.hp<=0)destroyB(b,'🪤 A armadilha quebrou')}

/* ---- sino de alarme: manda os moradores se esconderem enquanto há invasão ---- */
function tocaSino(b){
  if((b.cd||0)>G.t){toast('O sino ainda vibra. Espere um pouco.');return}
  b.cd=G.t+CB.sino.recarga;
  if(!G.raidOn){toast('🔔 O sino tocou. Sem invasão por enquanto.');return}
  let n=0;const L=longhouse();
  for(const u of G.units)if(u.kind==='villager'&&!u.hidden){u.flee=true;u.act=null;u.path=null;if(L)goRect(u,L.x,L.y,L.w,L.h);n++}
  toast(`🔔 Alarme! ${n} morador(es) correm para se esconder`,'good');sfx('bad')}

/* ---- animais: presas fogem, predadores atacam quem chega perto (lobos em bando) ---- */
function animaisCfg(){return CB.animais_por_bioma[G.biome]||CB.animais_padrao}
function animalSpot(minDist){for(let t=0;t<80;t++){const x=(rnd()*N)|0,y=(rnd()*N)|0,i=idx(x,y);
    if(!landT(G.tiles[i])||G.obj[i]||G.occ[i])continue;
    if(Math.hypot(x-G.start[0],y-G.start[1])<minDist)continue;
    const pl=PL();if(pl&&Math.hypot(x-pl.x,y-pl.y)<minDist)continue;return[x,y]}return null}
function spawnAnimal(sp,x,y){const A=ANIMAIS[sp];
  return spawnUnit('animal',x+.5,y+.5,{sp,name:A.n,hp:A.hp,max:A.hp,speed:A.vel,range:A.alcance||1,rate:A.vel_ataque||1,
    dmg:A.dano,tipo:A.tipo||'corte',efeito:[],atkCd:0,home:[x+.5,y+.5],idleT:rnd()*3,thinkT:rnd(),fleeT:0,target:null,repath:true})}
function spawnAnimais(){const cfg=animaisCfg();for(const sp in cfg)for(let k=0;k<cfg[sp];k++){const p=animalSpot(12);if(p)spawnAnimal(sp,p[0],p[1])}}
function animaisTick(dt){G.animT=(G.animT||0)+dt;if(G.animT<CB.animais_reaparece_segundos)return;G.animT=0;
  const cfg=animaisCfg(),cont={};for(const u of G.units)if(u.kind==='animal')cont[u.sp]=(cont[u.sp]||0)+1;
  const faltam=Object.keys(cfg).filter(sp=>(cont[sp]||0)<cfg[sp]);if(!faltam.length)return;
  const sp=faltam[(rnd()*faltam.length)|0],p=animalSpot(15);if(p)spawnAnimal(sp,p[0],p[1])}
function engage(u,t){const d=Math.hypot(t.x-u.x,t.y-u.y);
  if(d<=u.range){u.path=null;u.moving=false;u.face=(t.x-u.x)-(t.y-u.y)>0?1:-1;if(u.atkCd<=0){u.atkCd=u.rate;u.swing=.3;attack(u,t)}return true}
  if(u.repath||!u.path||!u.path.length){u.repath=false;const[tx,ty]=utile(t);const p=astar(...utile(u),nearRect(tx,ty,1,1),tx,ty,u.kind==='raider'?passR:passV,3000);if(p)u.path=p}
  return false}
function updAnimal(u,dt){
  u.atkCd-=dt;u.thinkT-=dt;const A=ANIMAIS[u.sp],pl=PL(),veP=!!pl&&!pl.down;
  if(u.thinkT<=0){u.thinkT=.35+rnd()*.25;u.repath=true;
    const dP=veP?Math.hypot(pl.x-u.x,pl.y-u.y):1e9;
    if(A.comportamento==='foge'){const silencioso=veP&&(armaDe(pl).efeito||[]).includes('silencioso');
      if(dP<A.medo&&!(silencioso&&dP>2))u.fleeT=Math.max(u.fleeT,G.t+3)}
    else if(veP&&dP<=A.aggro){u.target=pl.id;
      if(A.bando)for(const v of G.units)if(v!==u&&v.kind==='animal'&&v.sp===u.sp&&!v.target&&Math.hypot(v.x-u.x,v.y-u.y)<6)v.target=pl.id}
    if(u.target){const t=UMAP.get(u.target);if(!t||t.hp<=0||t.down||Math.hypot(t.x-u.x,t.y-u.y)>A.perseguicao)u.target=null}}
  if(u.target){const t=UMAP.get(u.target);
    if(t){if(engage(u,t))return;if(moveUnit(u,dt))return}}
  if(u.fleeT>G.t&&veP){
    if(!u.path||!u.path.length){const dx=u.x-pl.x,dy=u.y-pl.y,d=Math.hypot(dx,dy)||1;
      const tx=clamp(Math.floor(u.x+dx/d*7),0,N-1),ty=clamp(Math.floor(u.y+dy/d*7),0,N-1);
      const p=astar(...utile(u),(x,y)=>x===tx&&y===ty,tx,ty,passV,800);if(p)u.path=p}
    if(moveUnit(u,dt))return}
  if(moveUnit(u,dt))return;
  u.idleT=(u.idleT||0)-dt;
  if(u.idleT<=0){u.idleT=2.5+rnd()*4;const tx=clamp(Math.floor(u.home[0])+((rnd()*9)|0)-4,0,N-1),ty=clamp(Math.floor(u.home[1])+((rnd()*9)|0)-4,0,N-1);
    if(passV(tx,ty)){const p=astar(...utile(u),(x,y)=>x===tx&&y===ty,tx,ty,passV,400);if(p)u.path=p}}}

/* ---- saqueadores: o da onda define vida, dano e se leva tocha (fogo contra construção de madeira) ---- */
function spawnSaqueador(x,y,onda){const S=CB.saqueador,tocha=onda>=S.tocha_a_partir_da_onda&&rnd()<S.chance_tocha;
  const hp=S.hp_base+onda*S.hp_por_onda;
  return spawnUnit('raider',x,y,{hp,max:hp,dmg:tocha?S.dano_tocha:S.dano_base+onda*S.dano_por_onda,tipo:tocha?'fogo':S.tipo,tipoB:tocha?'fogo':S.tipo,
    range:S.alcance,rate:S.vel_ataque,speed:S.vel,efeito:[],
    tunic:pick(['#7d2219','#5a1a14','#2e2a28','#6b2a1e']),hair:pick(['#2a1d14','#6b3d1f','#3b2a1d'])})}

/* ---- tick de combate do jogador (chamado a cada quadro antes de agir) ---- */
function combateTick(u,dt){folTick(u,dt);u.atkCd=Math.max(0,(u.atkCd||0)-dt)}

/* save da versão 3 para a 4: recursos e itens novos começam em zero; animais são espalhados */
function migraV4(){for(const k in RES){G.inv[k]??=0;G.res[k]??=0}for(const k in ITEMS)G.items[k]??=0;
  if(!G.units.some(u=>u.kind==='animal'))spawnAnimais()}
/* ================= Sprites (Stylized Nature MegaKit, Quaternius, CC0) =================
   PNGs baked offline from the glTF pack (tools/sprite-bake). Keys:
   <biome>_oak_<c>, <biome>_pine_<c>, <biome>_bush, rock_<i>, pebble_<i>, flower_0.
   Snow biome keeps the procedural drawings: the pack has no matching snow look. */
const SPR={};
function sprInit(){return Promise.all(Object.keys(SPR_SRC).map(k=>{const img=new Image();img.src=SPR_SRC[k];SPR[k]={img,...SPR_META[k]};return img.decode().catch(()=>{})}))}
function sprFor(k){const s=SPR[k];return s&&s.img.complete&&s.img.naturalWidth?s:null}
// base point (x,y) = ground under the object; sc = same scale the procedural drawing uses (1 = targetH px)
function drawSpr(s,x,y,sc,skew){ctx.save();ctx.translate(x,y);if(skew)ctx.transform(1,0,skew,1,0,0);const k=sc*.5;ctx.drawImage(s.img,-s.ax*k,-s.ay*k,s.w*k,s.h*k);ctx.restore()}
function treeSpr(k,c){return BIO.snowy?null:sprFor(G.biome+'_'+(k==='oak'?'oak':'pine')+'_'+c)}
/* ================= Drawing: primitives ================= */
function box(x,y,w,h,z0,zh,cT,cL,cR){const z1=z0+zh;
  if(cL)pp([P(x,y+h,z0),P(x+w,y+h,z0),P(x+w,y+h,z1),P(x,y+h,z1)],cL);
  if(cR)pp([P(x+w,y+h,z0),P(x+w,y,z0),P(x+w,y,z1),P(x+w,y+h,z1)],cR);
  if(cT)pp([P(x,y,z1),P(x+w,y,z1),P(x+w,y+h,z1),P(x,y+h,z1)],cT)}
function roofCol(){return BIO.snowy?'#eef3f7':C.thatch}
function crossAt(tip,e1,e2){const k=.24;ctx.lineCap='round';ln(tip,[tip[0]+(tip[0]-e1[0])*k,tip[1]+(tip[1]-e1[1])*k],C.woodD,2.4);ln(tip,[tip[0]+(tip[0]-e2[0])*k,tip[1]+(tip[1]-e2[1])*k],C.woodD,2.4)}
function roofX(x,y,w,h,z,rise,col,cross){const o=.18,x0=x-o,x1=x+w+o,y0=y-o,y1=y+h+o,ym=y+h/2;
  const r0=P(x0,ym,z+rise),r1=P(x1,ym,z+rise),a0=P(x0,y0,z),a1=P(x1,y0,z),b0=P(x0,y1,z),b1=P(x1,y1,z);
  if(rise<(h/2+o)*HH)pp([a0,a1,r1,r0],shade(col,.12));
  pp([P(x+w,y,z),P(x+w,y+h,z),P(x+w,ym,z+rise*.92)],shade(C.wood,-.08));
  pp([r0,r1,b1,b0],shade(col,-.06));
  for(let t=.22;t<1;t+=.22)ln(lp(r0,b0,t),lp(r1,b1,t),'rgba(70,40,10,.2)',1);
  if(BIO.snowy)ln(b0,b1,C.thatch,2.2);
  ln(r1,b1,shade(col,-.32),2);ln(r0,r1,shade(col,.2),1.5);
  if(cross)crossAt(r1,b1,a1)}
function roofY(x,y,w,h,z,rise,col,cross){const o=.18,x0=x-o,x1=x+w+o,y0=y-o,y1=y+h+o,xm=x+w/2;
  const r0=P(xm,y0,z+rise),r1=P(xm,y1,z+rise),a0=P(x0,y0,z),a1=P(x0,y1,z),b0=P(x1,y0,z),b1=P(x1,y1,z);
  if(rise<(w/2+o)*HH)pp([a0,a1,r1,r0],shade(col,-.15));
  pp([P(x,y+h,z),P(x+w,y+h,z),P(xm,y+h,z+rise*.92)],shade(C.wood,-.3));
  pp([r0,r1,b1,b0],shade(col,.04));
  for(let t=.22;t<1;t+=.22)ln(lp(r0,b0,t),lp(r1,b1,t),'rgba(70,40,10,.2)',1);
  if(BIO.snowy)ln(b0,b1,C.thatch,2.2);
  ln(r1,a1,shade(col,-.35),2);ln(r0,r1,shade(col,.25),1.5);
  if(cross)crossAt(r1,a1,b1)}
function flag(x,y,c1,c2){const t=perfT*3,w=.7+windStrength()*.8;ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<=6;i++)ctx.lineTo(x+i*2.3,y+Math.sin(t+i*.8)*1.2*w*(i/6));for(let i=6;i>=0;i--)ctx.lineTo(x+i*2.3,y+10+Math.sin(t+i*.8)*1.2*w*(i/6));ctx.closePath();ctx.fillStyle=c1||'#2f5fa8';ctx.fill();
  ctx.beginPath();for(let i=0;i<=6;i++)ctx.lineTo(x+i*2.3,y+3.6+Math.sin(t+i*.8)*1.2*w*(i/6));for(let i=6;i>=0;i--)ctx.lineTo(x+i*2.3,y+6.4+Math.sin(t+i*.8)*1.2*w*(i/6));ctx.closePath();ctx.fillStyle=c2||'#eef0f2';ctx.fill()}
function barrel(cx,cy,s){s=s||1;ell(cx+1,cy,5*s,2.2*s,'rgba(0,0,0,.2)');ctx.fillStyle='#8a5a2e';ctx.fillRect(cx-4*s,cy-10*s,8*s,10*s);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(cx-4*s,cy-10*s,3*s,10*s);
  ell(cx,cy,4*s,1.8*s,'#7a4c26');ctx.fillStyle='#3a3330';ctx.fillRect(cx-4*s,cy-2.6*s,8*s,1.1*s);ctx.fillRect(cx-4*s,cy-8.4*s,8*s,1.1*s);ell(cx,cy-10*s,4*s,1.8*s,'#b07b46')}
function crate(x,y,s){s=s||1;const q=.24*s;box(x-q,y-q,2*q,2*q,0,9*s,'#c49563','#85592f','#a5733f');const a=P(x-q,y+q,0),b=P(x+q,y+q,9*s),c=P(x+q,y+q,0),d=P(x-q,y+q,9*s);ln(a,b,'rgba(60,35,15,.5)',1);ln(c,d,'rgba(60,35,15,.5)',1)}
function stake(q,h,col){const c=col||C.wood;ctx.fillStyle=shade(c,-.25);ctx.fillRect(q[0]-2.4,q[1]-h,2.4,h);ctx.fillStyle=c;ctx.fillRect(q[0],q[1]-h,2.4,h);
  ctx.beginPath();ctx.moveTo(q[0]-2.4,q[1]-h);ctx.lineTo(q[0],q[1]-h-4.5);ctx.lineTo(q[0]+2.4,q[1]-h);ctx.closePath();ctx.fillStyle=shade(c,.15);ctx.fill();if(BIO.snowy){ctx.fillStyle='#f2f6f9';ctx.fillRect(q[0]-1,q[1]-h-2,2,2)}}

/* ================= Drawing: nature ================= */
function windStrength(){return clamp(.5+.3*Math.sin(perfT*.13)+.2*Math.sin(perfT*.41+1),0,1)}

function audioInit(){if(SND.ctx||!settings.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();SND.ctx=c;SND.master=c.createGain();SND.master.gain.value=.7;SND.master.connect(c.destination);
  const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5}SND.brown=buf;
  const wb=c.createBuffer(1,len,c.sampleRate),wd=wb.getChannelData(0);for(let i=0;i<len;i++)wd[i]=Math.random()*2-1;SND.white=wb;
  const src=c.createBufferSource();src.buffer=buf;src.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=500;const g=c.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(SND.master);src.start();SND.wind={g,f}}catch(e){SND.ctx=null}}

function sfx(type){const c=SND.ctx;if(!c||!settings.sound||menuOpen)return;const t=c.currentTime;
  const env=(node,a,d,peak,st)=>{st=st||t;const g=c.createGain();g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(peak,st+a);g.gain.exponentialRampToValueAtTime(.0001,st+a+d);node.connect(g);g.connect(SND.master)};

  const nz=(fq,dur,peak,q,buf)=>{const s=c.createBufferSource();s.buffer=buf||SND.white;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q||1;s.connect(f);env(f,.003,dur,peak);s.start(t,Math.random());s.stop(t+dur+.05)};

   case'chop':nz(1100,.1,.35,1.4);osc('triangle',210,110,.08,.18);break;

   case'pick':osc('sine',520,900,.08,.12);break;

   case'store':osc('sine',700,1050,.1,.1);osc('sine',1050,1400,.1,.07,t+.08);break;
   case'splash':nz(1500,.25,.22,.7);break;
   case'tick':osc('sine',1200,1000,.03,.04);break;
   case'bad':osc('sawtooth',200,140,.22,.05);break;
   case'bird':{const f=2300+Math.random()*1500,n=2+(Math.random()*3|0);for(let i=0;i<n;i++)osc('sine',f,f*1.3,.07,.025,t+i*.12)}break}}

    if(a==='clear'){for(const k in G.inv)G.inv[k]=0;toast('Mochila esvaziada','good');devPanel()}
    if(a==='heal'){const p=PL();if(p){p.hp=p.max;p.down=0}toast('Curado','good')}
    if(a==='raid'){if(longhouse())spawnRaid();else toast('Precisa de Casa Comunal','bad')}
    if(a==='all'){for(const k in RES)G.inv[k]+=100;for(const k in ITEMS)G.items[k]=(G.items[k]||0)+1;toast('Tudo entregue','good');devPanel()}}}
/* ================= Game setup ================= */
const playerLook=()=>({name:'Você',tunic:'#2f5fa8',hair:'#d9a84e',skin:'#f1c9a0',fem:false,hp:100,max:100,speed:2,ox:0,oy:0});
function newGame(biome,seed,demo){BIO=BIOMES[biome];
  G={biome,seed:seed||((Math.random()*1e9)|0),tiles:new Uint8Array(N*N),wear:new Float32Array(N*N),h:new Float32Array(N*N),obj:new Array(N*N).fill(null),occ:new Int32Array(N*N),bld:[],units:[],decor:[],tombs:[],
    res:zerosRes(),inv:zerosRes(),items:zerosItems(),equip:emptyEquip(),animT:0,
    t:185,speed:1,idc:1,nextRaid:1e12,raidN:0,raidOn:false,regrow:[],fall:[],hints:{},flags:{},demo:!!demo};
  BMAP=new Map();UMAP=new Map();PT=[];AR=[];genMap();
  const p=spawnUnit('player',G.start[0]+.5,G.start[1]+.5,playerLook());G.pid=p.id;G.rs=(G.seed|0)^0x9e3779b9;spawnAnimais();
  initTiles();bgGrad=null;initWeather();makeThumbs();cam.z=isTouch?1.2:1.3;centerCam()}
function openMenu(inGame){menuOpen=true;$('#menu').classList.remove('hidden');$('#hud').classList.add('hidden');
  const top=$('#mTop');top.innerHTML=(inGame?'<button class="gbtn" id="mResume">▶ Voltar ao jogo</button><button class="sbtn" id="mSave">💾 Salvar</button>':'')+(hasSave()?'<button class="'+(inGame?'sbtn':'gbtn')+'" id="mLoad">📂 '+(inGame?'Carregar salvo':'Continuar jogo salvo')+'</button>':'');
  if(inGame){$('#mResume').onclick=closeMenu;$('#mSave').onclick=()=>{save();openMenu(true)}}
  const ml=$('#mLoad');if(ml)ml.onclick=()=>{if(load())closeMenu()};
  $('#biomes').innerHTML=Object.keys(BIOMES).map(k=>`<button class="bcard" data-b="${k}" style="background:${BIOMES[k].card}"><b>${BIOMES[k].name}</b><span>${BIOMES[k].desc}</span></button>`).join('');
  document.querySelectorAll('.bcard').forEach(el=>el.onclick=()=>{newGame(el.dataset.b);closeMenu()});
  const opt=[...([['sound','Sons','Vento, pássaros e ações'],['raids','Invasões','Só depois de ter Casa Comunal e moradores'],['daynight','Dia e noite','Ciclo de luz com fogueiras acesas'],['tilt','Efeito miniatura','Desfoque tilt-shift nas bordas (pesa em celulares)'],['calm','Modo tranquilo','Fome e frio mais lentos e sem perda de itens na morte'],['dev','Modo desenvolvedor','Recursos infinitos, construção instantânea, invencível e itens']])].filter(o=>o[0]!=='dev'||typeof devApply==='function');
  $('#opts').innerHTML=opt.map(([k,n,s])=>`<div class="tg"><div>${n}<small>${s}</small></div><button class="sw ${settings[k]?'on':''}" data-o="${k}"></button></div>`).join('');
  document.querySelectorAll('.sw').forEach(el=>el.onclick=()=>{const k=el.dataset.o;settings[k]=!settings[k];el.classList.toggle('on',settings[k]);saveSettings();applySettings()})}
function closeMenu(){menuOpen=false;$('#menu').classList.add('hidden');$('#hud').classList.remove('hidden');hudSig='';updHUD();mode={t:'none'};sel=null;closeSheet();$('#place').classList.remove('open');audioInit()}
function applySettings(){document.body.classList.toggle('tilt-on',!!settings.tilt);if(typeof devApply==='function')devApply()}

/* ================= Loop ================= */
let last=performance.now(),uiT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;perfT=now/1000;
  if(G&&!(paused&&!G.demo)&&!(menuOpen&&!G.demo)){const steps=G.demo?1:G.speed;for(let i=0;i<steps;i++)update(dt)}
  if(zT){const f=Math.pow(zT.z/cam.z,Math.min(1,dt*12));zoomAt(zT.px,zT.py,f);if(Math.abs(zT.z-cam.z)<.002)zT=null}
  if(camGo){const k=Math.min(1,dt*6);cam.x+=(camGo.x-cam.x)*k;cam.y+=(camGo.y-cam.y)*k;if(Math.abs(camGo.x-cam.x)+Math.abs(camGo.y-cam.y)<1)camGo=null}
  else if(G&&!menuOpen&&!ptrs.size){const p=PL();if(p&&p.moving){const[sx,sy]=w2s(p.x,p.y);const mx=W*.18,mt=H*.22,mb=H*.3;let dx=0,dy=0;if(sx<mx)dx=mx-sx;else if(sx>W-mx)dx=W-mx-sx;if(sy<mt)dy=mt-sy;else if(sy>H-mb)dy=H-mb-sy;const k=Math.min(1,dt*3);cam.x+=dx*k;cam.y+=dy*k}}
  updWeather(dt);render();audioTick(dt);
  uiT-=dt;if(uiT<=0&&!menuOpen){uiT=.25;updHUD();renderSheet();hintChecks()}
  requestAnimationFrame(frame)}
applySettings();
sprInit().then(()=>{newGame(pick(Object.keys(BIOMES)),null,true);cam.z=isTouch?.95:1.1;centerCam();openMenu(false)});
requestAnimationFrame(frame);
</script>
</body>
