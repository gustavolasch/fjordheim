<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1720;color:#f6ead2;font-family:'Nunito',system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#tiltT{top:0;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}

#bar button{background:none;border:none;color:rgba(246,234,210,.7);width:62px;height:48px;border-radius:17px;font:800 10px 'Nunito',system-ui,sans-serif;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0;transition:background .2s,color .2s,transform .12s}

#bar button.on{background:linear-gradient(180deg,rgba(243,201,105,.3),rgba(243,201,105,.12));color:#f8d985;box-shadow:inset 0 0 0 1px rgba(243,201,105,.36)}

#place{display:flex;align-items:center;gap:7px;padding:7px 8px}

#place .ok{color:#9be38a}#place .err{color:#ff9a8a}
.grab{display:block;width:100%;height:16px;background:none;border:none;cursor:pointer;padding:0}
.grab::after{content:'';display:block;width:38px;height:4px;border-radius:4px;background:rgba(255,235,200,.32);margin:6px auto 0}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px;touch-action:pan-x}
.cats::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid transparent;color:rgba(246,234,210,.72);font:800 11.5px 'Nunito',system-ui,sans-serif;cursor:pointer;transition:background .2s,color .2s}

.cat.on{background:rgba(243,201,105,.18);border-color:rgba(243,201,105,.42);color:#f8d985}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;padding:1px}
.strip.grid{flex-wrap:wrap;max-height:36vh;overflow-y:auto;touch-action:pan-y}
.pc{flex:none;width:78px;background:rgba(0,0,0,.26);border:1px solid rgba(243,201,105,.13);border-radius:13px;padding:3px 3px 6px;color:inherit;font:inherit;text-align:center;cursor:pointer;transition:transform .12s,border-color .2s}
.pc:active{transform:scale(.95)}
.strip.grid .pc{width:calc((100% - 18px)/4)}
.pc img{width:100%;aspect-ratio:192/168;display:block}
.pc b{display:flex;align-items:center;justify-content:center;font-size:10.5px;line-height:1.1;min-height:24px;padding:0 1px}
.pc i{font-style:normal;font-size:10px;opacity:.92;display:block;white-space:nowrap}
.pc.sel{border-color:#f3c969;box-shadow:inset 0 0 0 1px #f3c969;background:rgba(243,201,105,.14)}
.pc.dis img{opacity:.55}
h2{font-family:'Cinzel',serif;font-size:17px;margin:0 0 4px;color:#f3c969;letter-spacing:.03em}
h4{font-family:'Cinzel',serif;color:#f3c969;font-size:13px;margin:12px 0 6px;letter-spacing:.03em}
.hint{font-size:12.5px;opacity:.82;margin:0 0 10px;line-height:1.35}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.x{background:none;border:none;color:#f6ead2;font-size:19px;cursor:pointer;padding:0 4px;line-height:1;opacity:.8}
.cost{font-size:11.5px;opacity:.92}
.no{color:#ff8a7a}
.gbtn{background:linear-gradient(#f3c969,#c9962f);color:#2a1a0a;border:none;border-radius:11px;padding:9px 14px;font:900 14px 'Nunito',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.gbtn:disabled{opacity:.4}
.sbtn{background:rgba(255,255,255,.07);color:#f6ead2;border:1px solid rgba(243,201,105,.25);border-radius:11px;padding:8px 11px;font:800 13px 'Nunito',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sbtn.on{background:rgba(243,201,105,.25);color:#f3c969}
.sbtn.red{border-color:#ff8a7a;color:#ffb0a3}
.sbtn:disabled{opacity:.4}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.meter{height:8px;background:rgba(0,0,0,.45);border-radius:9px;overflow:hidden;flex:1;min-width:80px}
.meter i{display:block;height:100%;background:#7bd36b;transition:width .3s}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:5px 2px;border-bottom:1px solid rgba(243,201,105,.1)}
.tbl td:last-child{text-align:right;font-weight:800}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{background:rgba(0,0,0,.25);border:1px solid rgba(243,201,105,.16);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px}
.item .ic{font-size:22px}
.item .top{display:flex;align-items:center;gap:8px}
.item .cnt{margin-left:auto;font-weight:900;font-size:17px;color:#f3c969}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{background:rgba(0,0,0,.28);border:1px solid rgba(243,201,105,.13);border-radius:12px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.slot span{font-size:19px}.slot b{font-size:15px}.slot small{font-size:9.5px;opacity:.7}
.slot.z{opacity:.4}
.small{font-size:11.5px;opacity:.85}
.queue{display:flex;gap:4px;flex-wrap:wrap;font-size:20px;min-height:26px}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,15,25,.25),rgba(5,8,14,.82));overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 12px calc(env(safe-area-inset-bottom,0px) + 24px);touch-action:pan-y}
.mbox{width:min(100%,560px);padding:22px 18px;text-align:center;margin:auto}
h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(36px,10vw,56px);letter-spacing:.08em;margin:0;color:#f3c969;text-shadow:0 3px 0 #6b4513,0 8px 24px rgba(0,0,0,.6)}
.sub{margin:4px 0 16px;opacity:.85;font-weight:700}
h3{font-family:'Cinzel',serif;color:#f3c969;font-size:15px;margin:18px 0 10px;letter-spacing:.04em}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{border-radius:14px;padding:12px;min-height:104px;text-align:left;cursor:pointer;border:1px solid rgba(255,255,255,.25);color:#fff;font:inherit;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.bcard b{font-family:'Cinzel',serif;font-size:15px}
.bcard span{font-size:12px;opacity:.95;line-height:1.25;margin-top:3px}
.mrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.opts{text-align:left;margin-top:6px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:700;font-size:14px;gap:10px}
.tg small{display:block;font-weight:600;opacity:.7;font-size:12px}
.sw{flex:none;width:48px;height:28px;border-radius:99px;background:#5a5048;position:relative;border:none;cursor:pointer}
.sw.on{background:#c9962f}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{left:24px}
.help{font-size:12px;opacity:.7;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tiltT" class="tilt"></div><div id="tiltB" class="tilt"></div>

<div id="hud" class="hidden">
  <div id="top"><div id="res" class="glass"></div><button id="bLoc" class="rbtn glass" title="Encontrar personagem"></button><button id="bSpeed" class="rbtn glass" title="Velocidade">1×</button><button id="bMenu" class="rbtn glass" title="Menu"></button></div>
  <div id="hint" class="glass off"><span class="ic">💡</span><span id="hintT"></span><button id="hintX" aria-label="Dispensar">✕</button></div>
  <div id="raid" class="hidden"></div>
  <div id="toasts"></div>
  <div id="sheet" class="glass"></div>
  <div id="place" class="glass"></div>

    <button data-tab="build"></button>
    <button data-tab="craft"></button>
    <button data-tab="bag"></button>
    <button data-tab="edit"></button>

</div>
<div id="menu">
  <div class="mbox panel">

    <p class="help">Toque no chão para andar e nos objetos para coletar · arraste para mover a câmera · pinça ou roda do mouse para zoom</p>
  </div>
</div>
<script>

const HW=32,HH=16,N=68,SC=N/48,ZMIN=.32,ZMAX=3.2,SAVE_KEY='fjordheim_save_v2',SET_KEY='fjordheim_settings_v1',BAG=20;

const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;

function hash2(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function makeNoise(seed){const r=mulberry32(seed),S=64,g=new Float32Array(S*S);for(let i=0;i<S*S;i++)g[i]=r();
  const at=(x,y)=>g[(((y%S)+S)%S)*S+(((x%S)+S)%S)],sm=t=>t*t*(3-2*t);
  function v(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi),a=at(xi,yi),b=at(xi+1,yi),c=at(xi,yi+1),d=at(xi+1,yi+1);return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf}
  return (x,y)=>{let s=0,amp=1,f=1,t=0;for(let o=0;o<4;o++){s+=v(x*f+o*17,y*f+o*31)*amp;t+=amp;amp*=.5;f*=2}return s/t}}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function rgbS(r,g,b,a){return a==null?`rgb(${r|0},${g|0},${b|0})`:`rgba(${r|0},${g|0},${b|0},${a})`}

/* ================= Map generation ================= */
function idx(x,y){return y*N+x}
function inb(x,y){return x>=0&&y>=0&&x<N&&y<N}
function landT(t){return t===2||t===3}
function treeKind(r){let a=r();for(const[k,p]of BIO.tree){if(a<p)return k;a-=p}return BIO.tree[0][0]}
function newTree(r,g){return{t:'tree',k:treeKind(r),c:(r()*6)|0,ox:(r()-.5)*.35,oy:(r()-.5)*.35,s:.85+r()*.35,hp:5,g:g==null?1:g}}
const ROCK=(r,t)=>({t,amt:t==='ore'?4:6,s:.8+r()*.35,sd:r()*9});
const PEBBLE=r=>({t:'pebble',s:.8+r()*.4,sd:r()*9});
const BRANCH=r=>({t:'branch',s:.85+r()*.3,sd:r()*9});
function genMap(){
  const r=mulberry32(G.seed);rng=r;
  const n1=makeNoise(G.seed+1),n2=makeNoise(G.seed+7),n3=makeNoise(G.seed+13);
  const T=G.tiles;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const e=n1(x/11,y/11),f=n2(x/7,y/7),k=n3(x/5,y/5);let t=3;
    if(G.biome==='autumn'){const v=e*.7+(x/N)*.55+(y>N*.8?-.08:0);if(v<.53)t=0;else if(k>.75)t=4}
    else if(G.biome==='forest'){const cx=N*.36+(n1(y/9,3.3)-.5)*16*SC;if(Math.abs(x-cx)<1.8)t=1;else if(k>.74)t=4}
    else if(G.biome==='coast'){if(y+(e-.5)*16*SC<8*SC)t=0;else if(x>N-7*SC+(f-.5)*8*SC)t=4;else if(k>.77)t=4}
    else{if((N-x)+(e-.5)*14*SC<11*SC)t=0;else if(y<6*SC+(f-.5)*8*SC)t=4;else if(k>.79)t=4}
    T[idx(x,y)]=t;G.h[idx(x,y)]=12+hash2(x,y)*16+(t===4?k*10:0);
  }
  const T2=T.slice();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=idx(x,y),t=T[i];let nl=false,nw=false;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(!inb(X,Y))continue;const q=T[idx(X,Y)];if(q>=2)nl=true;if(q<=1)nw=true}
    if(t===0&&nl)T2[i]=1;if(t>=3&&nw&&G.biome!=='forest'&&t!==4)T2[i]=2}
  G.tiles.set(T2);
  // natural objects — densities lowered so the 2x island feels open, not twice as crowded
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=idx(x,y),t=G.tiles[i];if(!landT(t))continue;
    const fr=n2(x/6+50,y/6+50);let nearRock=false,nearW=false;
    for(let d=0;d<4;d++){const X=x+[1,-1,0,0][d],Y=y+[0,0,1,-1][d];if(inb(X,Y)){const q=G.tiles[idx(X,Y)];if(q===4)nearRock=true;if(q<=1)nearW=true}}
    if(t===3&&fr>.55&&r()<.45)G.obj[i]=newTree(r);
    else if(nearRock&&r()<.07)G.obj[i]=ROCK(r,'ore');
    else if(r()<.006||(G.biome==='forest'&&nearW&&r()<.1))G.obj[i]=ROCK(r,'stone');
    else if(r()<.0025)G.obj[i]=ROCK(r,'ore');
    else if(t===3&&r()<.012)G.obj[i]={t:'bush',s:.8+r()*.4,c:r(),b:3};
    else if(r()<.011)G.obj[i]=PEBBLE(r)}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=idx(x,y);if(G.obj[i]||!landT(G.tiles[i]))continue;let nt=false;
    for(let dy=-1;dy<=1&&!nt;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(inb(X,Y)&&G.obj[idx(X,Y)]&&G.obj[idx(X,Y)].t==='tree'){nt=true;break}}
    if(nt&&r()<.1)G.obj[i]=BRANCH(r)}
  // start site: an open clearing near the middle of the island
  let best=null,bs=1e9;
  for(let y=8;y<N-10;y++)for(let x=8;x<N-10;x++){let ok=true;
    for(let dy=-3;dy<6&&ok;dy++)for(let dx=-3;dx<6;dx++){if(!landT(G.tiles[idx(x+dx,y+dy)])){ok=false;break}}
    if(!ok)continue;const d=Math.hypot(x-N/2+1,y-N/2+1);if(d<bs){bs=d;best=[x,y]}}
  if(!best)best=[N/2-1,N/2-1];
  const[sx,sy]=best;G.start=[sx+1,sy+1];
  for(let y=sy-5;y<sy+8;y++)for(let x=sx-5;x<sx+8;x++){if(inb(x,y)&&Math.hypot(x-sx-1,y-sy-1)<4.2)G.obj[idx(x,y)]=null}
  const ring=(mk,n,r0,r1)=>{let c=0;for(let k=0;k<500&&c<n;k++){const a=r()*6.283,d=r0+r()*(r1-r0),x=Math.round(sx+1+Math.cos(a)*d),y=Math.round(sy+1+Math.sin(a)*d);
    if(!inb(x,y))continue;const i=idx(x,y);if(!landT(G.tiles[i])||G.obj[i])continue;G.obj[i]=mk();c++}};
  ring(()=>BRANCH(r),6,1.5,5);ring(()=>PEBBLE(r),6,2,6);ring(()=>newTree(r),5,5,9);ring(()=>({t:'bush',s:.9,c:r(),b:3}),2,3,7);ring(()=>ROCK(r,'stone'),2,6,10);ring(()=>ROCK(r,'ore'),1,8,12);
}
function freeNear(cx,cy,R){for(let r=0;r<=R;r++)for(let k=0;k<20;k++){const x=cx+Math.round((Math.random()*2-1)*r),y=cy+Math.round((Math.random()*2-1)*r);if(passV(x,y))return[x,y]}return null}

/* ================= Tile colors ================= */
function initTiles(){
  const gn=makeNoise(G.seed+21);TC=new Array(N*N);TUFT=new Array(N*N);
  for(let i=0;i<N*N;i++){const x=i%N,y=(i/N)|0,v=hash2(x,y),t=G.tiles[i];
    TUFT[i]=t===3&&v>.45?[(hash2(x+7,y)-.5)*.6,(hash2(x,y+9)-.5)*.6,(hash2(x+3,y+5)*3)|0]:null;
    if(t===3){const pal=BIO.grass;TC[i]=hexRgb(pal[clamp((gn(x/6,y/6)*1.6-.3)*pal.length|0,0,pal.length-1)]).map(c=>c+(v-.5)*14)}
    else if(t===2)TC[i]=hexRgb(BIO.sand).map(c=>c+(v-.5)*12);
    else if(t===4)TC[i]=hexRgb(BIO.cliffTop).map(c=>c+(v-.5)*16);
    else TC[i]=null}
  G.tcs=new Array(N*N);for(let i=0;i<N*N;i++)refreshTile(i);
}
const DIRT=()=>hexRgb(BIO.dirt);
function refreshTile(i){const b=TC[i];if(!b){G.tcs[i]=null;return}const w=Math.min(1,G.wear[i]/26);const d=DIRT();G.tcs[i]=rgbS(lerp(b[0],d[0],w),lerp(b[1],d[1],w),lerp(b[2],d[2],w))}
function wearTile(x,y){const i=idx(x,y);if(G.tiles[i]!==3&&G.tiles[i]!==2)return;const o=G.wear[i];if(o>=30)return;G.wear[i]=o+.35;if((o/2|0)!==(G.wear[i]/2|0))refreshTile(i)}

/* ================= Resources & storage ================= */
function have(k){return(G.inv[k]||0)+(G.res[k]||0)}
function afford(c){for(const k in c)if(have(k)<c[k])return false;return true}
function pay(c){for(const k in c){let n=c[k];const a=Math.min(n,G.inv[k]);G.inv[k]-=a;n-=a;G.res[k]=Math.max(0,G.res[k]-n)}}
function refund(c,f){const cap=storeCap();for(const k in c){let v=Math.floor(c[k]*f);const s=Math.min(v,Math.max(0,cap-G.res[k]));G.res[k]+=s;G.inv[k]+=v-s}}
function costHTML(c){const ks=Object.keys(c);if(!ks.length)return'grátis';return ks.map(k=>`<span class="${have(k)<c[k]?'no':''}">${RES[k][0]}${c[k]}</span>`).join(' ')}
function storeCap(){let c=0;for(const b of G.bld)if(b.done&&BD[b.type].store)c+=BD[b.type].store;return c}
function bagW(){let w=0;for(const k in G.inv)w+=G.inv[k]*WEIGHT[k];return Math.round(w*10)/10}
function canCarry(k,n){return bagW()+WEIGHT[k]*(n||1)<=BAG+1e-6}
function addInv(k,n,x,y){G.inv[k]+=n;if(x!=null)floater(x,y,`+${n} ${RES[k][0]}`)}
function addRes(k,v,x,y){const cap=storeCap();G.res[k]=Math.min(cap,G.res[k]+v);if(x!=null)floater(x,y,`+${v} ${RES[k][0]}`)}
function deposit(b){const cap=storeCap();let moved=0;for(const k in G.inv){const n=Math.min(G.inv[k],Math.max(0,cap-G.res[k]));if(n>0){G.inv[k]-=n;G.res[k]+=n;moved+=n}}
  if(moved){sfx('store');floater(b.x+b.w/2,b.y+b.h/2,'📦 guardado');completeHint('full');G.flags.deposited=true;if(bagW()>0)toast('Depósito cheio para alguns itens. Construa outro.')}
  else if(bagW()>0)toast('Os depósitos estão cheios. Construa outro.','bad');else toast('Mochila vazia')}
function bagFull(k){const w=bagW();toast(k&&w<BAG?`🎒 Sem espaço para ${RES[k][1].toLowerCase()} (pesa ${WEIGHT[k]}). Mochila ${w}/${BAG}.`:`🎒 Mochila cheia (${w}/${BAG}). Guarde numa Pilha de recursos.`,'bad');showHint('full');sfx('bad')}

/* ================= Buildings logic ================= */
function bAt(x,y){if(!inb(x,y))return null;const id=G.occ[idx(x,y)];return id?BMAP.get(id):null}
function longhouse(){return G.bld.find(b=>b.type==='longhouse')}
function houseCap(){let c=0;for(const b of G.bld)if(b.done&&BD[b.type].house)c+=BD[b.type].house;return c}
function popCount(){let c=0;for(const u of G.units)if(u.kind==='villager'||u.kind==='warrior')c++;return c}
function placeCheck(type,x,y){const d=BD[type];let water=0,land=0;
  for(let dy=0;dy<d.h;dy++)for(let dx=0;dx<d.w;dx++){const X=x+dx,Y=y+dy;if(!inb(X,Y))return'Fora do mapa';const i=idx(X,Y);

    if(t){const d=Math.hypot(t.x-u.x,t.y-u.y);if(d>u.range*.9){const[tx,ty]=utile(t);u.path=astar(...utile(u),(x,y)=>Math.hypot(x-tx,y-ty)<=Math.max(1,u.range*.8),tx,ty,passV,3000)}else u.path=null}
    else if((!u.path||!u.path.length)&&u.post){const p=u.post;if(Math.hypot(p[0]+.5-u.x,p[1]+.5-u.y)>2.5){const pa=astar(...utile(u),nearRect(p[0],p[1],1,1),p[0],p[1],passV,3000);if(pa)u.path=pa}}}
  const t=u.target&&UMAP.get(u.target);
  if(t&&Math.hypot(t.x-u.x,t.y-u.y)<=u.range){u.path=null;u.moving=false;u.face=(t.x-u.x)-(t.y-u.y)>0?1:-1;if(u.atkCd<=0){u.atkCd=u.rate;u.swing=.3;attack(u,t)}return}
  moveUnit(u,dt)}
function updRaider(u,dt){u.atkCd-=dt;u.thinkT-=dt;
  if(u.thinkT<=0){u.thinkT=.5+Math.random()*.3;
    const e=nearestUnit(u.x,u.y,4.5,v=>(v.kind==='warrior')||(v.kind==='villager'&&!v.hidden)||(v.kind==='player'&&!v.down));
    if(e){u.target=e.id;if(Math.hypot(e.x-u.x,e.y-u.y)>u.range){const[tx,ty]=utile(e);u.path=astar(...utile(u),nearRect(tx,ty,1,1),tx,ty,passR,3000);u.attackB=null}}
    else{u.target=null;let b=u.tb&&BMAP.get(u.tb);if(!b){let bd=1e9;for(const c of G.bld){const d0=BD[c.type];if(d0.wall||d0.gate||d0.pass)continue;const d=Math.hypot(c.x+c.w/2-u.x,c.y+c.h/2-u.y);if(d<bd){bd=d;b=c}}u.tb=b?b.id:null}
      if(b&&!isNear(u,b)&&!u.attackB&&(!u.path||!u.path.length)){if(!goRect(u,b.x,b.y,b.w,b.h,false,passR))u.tb=null}}}
  const t=u.target&&UMAP.get(u.target);
  if(t&&!t.hidden&&!t.down&&Math.hypot(t.x-u.x,t.y-u.y)<=u.range){u.moving=false;u.face=(t.x-u.x)-(t.y-u.y)>0?1:-1;if(u.atkCd<=0){u.atkCd=u.rate;u.swing=.3;attack(u,t)}return}
  if(u.attackB){const wb=BMAP.get(u.attackB);if(wb){u.moving=false;if(u.atkCd<=0){u.atkCd=u.rate;u.swing=.3;damageB(wb,u.dmg)}return}u.attackB=null}
  const b=u.tb&&BMAP.get(u.tb);if(b&&isNear(u,b)){u.path=null;u.moving=false;if(u.atkCd<=0){u.atkCd=u.rate;u.swing=.3;damageB(b,u.dmg)}return}
  moveUnit(u,dt)}
function attack(a,t){if(a.ranged){AR.push({x:a.x,y:a.y,z:14,tid:t.id,dmg:a.dmg,sp:9});return}dmgUnit(t,a.dmg)}
function dmgUnit(t,d){t.hp-=d;for(let k=0;k<3;k++)puff(t.x,t.y,'blood');
  if(t.kind==='player'){if(t.hp<=0&&!t.down){t.hp=0;t.down=6;t.path=null;t.act=null;t.order=null;toast('💫 Você desmaiou...','bad')}return}
  if(t.hp<=0)killUnit(t)}
function killUnit(u){for(let k=0;k<8;k++)puff(u.x,u.y,'smoke');removeUnit(u);
  if(u.kind==='raider'){if(!raidActive()&&G.raidOn){G.raidOn=false;const iron=3+G.raidN*2;addInv('iron',iron);toast(`🏆 Invasores derrotados! Deixaram 🔩${iron}`,'good')}}
  else toast(`💀 ${u.name} caiu em combate`,'bad')}
function spawnRaid(){G.raidN++;const n=Math.min(14,2+Math.floor(G.raidN*1.6));const L=longhouse();if(!L)return;let sp=null;
  for(let k=0;k<50&&!sp;k++){const s=(Math.random()*4)|0,t=(Math.random()*N)|0;const x=s===0?0:s===1?N-1:t,y=s===2?0:s===3?N-1:t;if(!passR(x,y))continue;
    if(astar(x,y,nearRect(L.x,L.y,L.w,L.h),L.x+1,L.y+1,passR,12000))sp=[x,y]}
  if(!sp){G.nextRaid=G.t+90;return}
  for(let i=0;i<n;i++){const hp=60+G.raidN*8;spawnUnit('raider',sp[0]+.5+(Math.random()-.5)*.8,sp[1]+.5+(Math.random()-.5)*.8,{hp,max:hp,dmg:7+G.raidN,range:1.2,rate:1.1,speed:1.45,tunic:pick(['#7d2219','#5a1a14','#2e2a28','#6b2a1e']),hair:pick(['#2a1d14','#6b3d1f','#3b2a1d'])})}
  G.raidOn=true;toast(`⚔️ ${n} invasores atacam a vila!`,'bad')}

/* ================= The player ================= */
function PL(){return G&&UMAP.get(G.pid)}
function adjT(u,x,y){const[tx,ty]=utile(u);return Math.abs(tx-x)<=1&&Math.abs(ty-y)<=1}
function order(o){const u=PL();if(!u||u.down)return;const old=u.order;if(old&&old.paid&&!old.done)refund(old.paid,1);u.order=o;u.path=null;u.act=null;u.idleT=0}
function stepTo(u,o,rx,ry,rw,rh,inside){if(o.tries>1){u.order=null;if(!o.auto)toast('Não dá para chegar lá','bad');return false}o.tries=(o.tries||0)+1;if(!goRect(u,rx,ry,rw,rh,inside,passV,9000)){u.order=null;if(!o.auto)toast('Não dá para chegar lá','bad');return false}return true}
function faceTo(u,x,y){if(Math.abs((x-u.x)-(y-u.y))>.05)u.face=(x-u.x)-(y-u.y)>0?1:-1}
function updPlayer(u,dt){
  if(u.down>0){u.down-=dt;if(u.down<=0){u.hp=u.max;u.down=0;const s=G.bld.find(b=>b.done&&(b.type==='shelter'||b.type==='house'||b.type==='longhouse'));const p=s?freeNear(s.x+1,s.y+s.h,3):freeNear(G.start[0],G.start[1],3);if(p){u.x=p[0]+.5;u.y=p[1]+.5}toast('Você acordou.')}return}
  if(u.hp<u.max)u.hp=Math.min(u.max,u.hp+dt*1.5);
  if(moveUnit(u,dt))return;
  if(u.act){u.act.t+=dt;actTick(u,dt);if(u.act&&u.act.t>=u.act.dur){const a=u.act;u.act=null;finishP(u,a)}return}
  const o=u.order;
  if(!o){u.idleT=(u.idleT||0)+dt;
    if(G.demo){if(u.idleT>2.5){u.idleT=0;const q=freeNear(G.start[0]+((Math.random()*12-6)|0),G.start[1]+((Math.random()*12-6)|0),2);if(q){const p=astar(...utile(u),(x,y)=>x===q[0]&&y===q[1],q[0],q[1],passV,2000);if(p)u.path=p}}return}
    if(u.idleT>1){const s=nearestSite(u);if(s){u.order={type:'build',b:s.id,auto:true}}u.idleT=0}return}
  switch(o.type){
  case'move':u.order=null;return;
  case'obj':{const ob=G.obj[o.i],x=o.i%N,y=(o.i/N)|0;if(!ob){u.order=null;return}
    if(!adjT(u,x,y)){stepTo(u,o,x,y,1,1);return}
    o.tries=0;faceTo(u,x+.5,y+.5);startObj(u,o,ob);return}
  case'build':{const b=BMAP.get(o.b);if(!b||(b.done&&b.hp>=b.max)){u.order=null;return}
    if(!isNear(u,b)){if(!stepTo(u,o,b.x,b.y,b.w,b.h))b.unr=G.t+15;return}
    o.tries=0;faceTo(u,b.x+b.w/2,b.y+b.h/2);u.tb=b.id;u.act={type:'build',b:b.id,t:0,dur:2};return}
  case'deposit':{const b=BMAP.get(o.b);if(!b){u.order=null;return}if(!isNear(u,b)){stepTo(u,o,b.x,b.y,b.w,b.h);return}deposit(b);u.order=null;return}
  case'fish':{const{x,y}=o;if(!G.items.rod){toast('Precisa de uma 🎣 Vara de pesca (Criar).','bad');u.order=null;return}
    const[tx,ty]=utile(u);const onSpot=adjT(u,x,y)&&passV(tx,ty);if(!onSpot){stepTo(u,o,x,y,1,1);return}
    if(!canCarry('food')){bagFull();u.order=null;return}o.tries=0;faceTo(u,x+.5,y+.5);u.act={type:'fish',t:0,dur:4,fx:x+.5,fy:y+.5};return}
  case'farm':{const b=BMAP.get(o.b);if(!b||!b.done){u.order=null;return}const[tx,ty]=utile(u);
    if(!(tx>=b.x&&ty>=b.y&&tx<b.x+3&&ty<b.y+3)){stepTo(u,o,b.x,b.y,3,3,true);return}o.tries=0;u.act={type:'farm',t:0,dur:3*(G.items.sickle>0?.62:1.25),b:b.id};return}
  case'craft':{if(!o.started){o.started=true;u.act={type:'craft',item:o.item,t:0,dur:1.4}}return}
  case'forge':{const b=BMAP.get(o.b);if(!b){u.order=null;return}if(!isNear(u,b)){stepTo(u,o,b.x,b.y,b.w,b.h);return}if(!o.started){o.started=true;faceTo(u,b.x+1,b.y+1);u.act={type:'forge',item:o.item,t:0,dur:2.6}}return}
  }}
function startObj(u,o,ob){
  switch(ob.t){
  case'tree':if(ob.g<.7){toast('Árvore jovem demais. Deixe crescer.');u.order=null;return}
    if(!G.items.axe){toast('Precisa de um 🪓 Machado de pedra (Criar).','bad');showHint('craft',true);u.order=null;return}
    u.act={type:'chop',i:o.i,t:0,dur:.85};return;
  case'falling':u.act={type:'wait',t:0,dur:.25};return;
  case'log':if(!canCarry('wood')){bagFull('wood');u.order=null;return}u.act={type:'takelog',i:o.i,t:0,dur:1.1};return;
  case'branch':if(!canCarry('stick')){bagFull('stick');u.order=null;return}u.act={type:'pickup',i:o.i,t:0,dur:.45,k:'stick'};return;
  case'pebble':if(!canCarry('stone')){bagFull('stone');u.order=null;return}u.act={type:'pickup',i:o.i,t:0,dur:.45,k:'stone'};return;
  case'stone':case'ore':{if(!G.items.pick){toast('Rocha grande demais para levar. Precisa de ⛏️ Picareta.','bad');showHint('pick',true);u.order=null;return}
    const k=ob.t==='ore'?'iron':'stone';if(!canCarry(k)){bagFull(k);u.order=null;return}u.act={type:'mine',i:o.i,t:0,dur:1.5,k};return}
  case'bush':if(!(ob.b>0)){if(!o.cont)toast('Sem frutinhas agora. Elas voltam com o tempo.');u.order=null;return}if(!canCarry('food')){bagFull('food');u.order=null;return}u.act={type:'berry',i:o.i,t:0,dur:.7};return;
  case'stump':if(!o.cont)toast('Um toco. A árvore volta a crescer com o tempo.');u.order=null;return;
  default:u.order=null}}
function ptool(k){if(G.items[k]>0&&Math.random()<.012){G.items[k]--;toast(`💥 Seu ${ITEMS[k].n} quebrou`,'bad');sfx('bad')}}
function finishP(u,a){const o=u.order;if(o&&o.type==='obj')o.cont=true;const ob=a.i!=null?G.obj[a.i]:null;const ox=a.i!=null?a.i%N+.5:0,oy=a.i!=null?(a.i/N|0)+.5:0;
  switch(a.type){
  case'chop':if(ob&&ob.t==='tree'){chopHit(a.i,ob);sfx('chop');ptool('axe')}break;
  case'takelog':if(ob&&ob.t==='log'&&canCarry('wood')){ob.amt--;addInv('wood',1,ox+.6,oy);sfx('pick');if(ob.amt<=0)toStump(a.i,ob);completeHint('log')}break;
  case'pickup':if(ob){G.obj[a.i]=null;addInv(a.k,1,ox,oy);sfx('pick');for(let k=0;k<3;k++)puff(ox,oy,'pop');completeHint('walk')}break;
  case'mine':if(ob&&(ob.t==='stone'||ob.t==='ore')){ob.amt--;addInv(a.k,1,ox,oy);sfx('mine');for(let k=0;k<3;k++)puff(ox,oy,'rockchip');if(ob.amt<=0){G.obj[a.i]=null;for(let k=0;k<5;k++)puff(ox,oy,'dust')}ptool('pick')}break;
  case'berry':if(ob&&ob.t==='bush'&&ob.b>0){ob.b--;addInv('food',1,ox,oy);sfx('pick');puff(ox,oy,'pop');if(!ob.tr){ob.tr=1;G.regrow.push(a.i)}}break;
  case'fish':if(Math.random()<.65){addInv('food',1,a.fx,a.fy);fishJump(a.fx,a.fy);sfx('splash')}ptool('rod');if(!canCarry('food')){u.order=null;bagFull()}break;
  case'farm':{const b=BMAP.get(a.b);if(b){b.grow+=.15;for(let k=0;k<2;k++)puff(b.x+Math.random()*3,b.y+Math.random()*3,'dust');if(b.grow>=1){b.grow=0;const n=Math.min(4,Math.floor((BAG-bagW())/WEIGHT.food+1e-6));if(n>0){addInv('food',n,b.x+1.5,b.y+1.5);sfx('store')}else{bagFull();u.order=null}}}break}
  case'craft':case'forge':G.items[a.item]++;floater(u.x,u.y,`+1 ${ITEMS[a.item].ic}`);sfx('craft');if(o)o.done=true;u.order=null;if(a.item==='axe')completeHint('craft');if(a.item==='pick')completeHint('pick');break}}

/* ================= Hints (contextual, dismiss on completion) ================= */
let hintCur=null,hintAt=0;
function showHint(id,force){if(!G||G.demo||G.hints[id])return;if(hintCur===id)return;if(hintCur&&!force)return;hintCur=id;hintAt=perfT;$('#hintT').textContent=HINTS[id];$('#hint').classList.remove('off')}
function completeHint(id){if(!G)return;G.hints[id]=1;if(hintCur===id){hintCur=null;$('#hint').classList.add('off')}}
$('#hintX').addEventListener('click',()=>{if(hintCur)completeHint(hintCur)});
function hintChecks(){if(!G||G.demo||menuOpen)return;
  if(hintCur&&(hintCur==='night'||hintCur==='fence')&&perfT-hintAt>14)completeHint(hintCur);
  if(hintCur)return;
  if(!G.hints.walk)return showHint('walk');
  if(!G.hints.craft&&have('stick')>=2&&have('stone')>=2&&!G.items.axe)return showHint('craft');
  if(!G.hints.chop&&G.items.axe>0)return showHint('chop');
  if(!G.hints.shelter&&G.flags.deposited&&!G.bld.some(b=>b.type==='shelter'))return showHint('shelter');
  if(!G.hints.night&&darkness()>.25)return showHint('night')}

/* ================= Particles ================= */
function puff(x,y,type){if(PT.length>500)return;const r=Math.random;
  const p={type,x:x+(r()-.5)*.3,y:y+(r()-.5)*.3,z:4,vx:0,vy:0,vz:0,life:1,max:1,r:3,g:0};
  if(type==='smoke'){p.z=8+r()*10;p.vz=14+r()*8;p.vx=.15+r()*.1;p.vy=-.1;p.r=3+r()*3;p.life=p.max=2.5+r()*1.5}
  else if(type==='chimney'){p.type='smoke';p.vz=12+r()*5;p.vx=.12+windStrength()*.15;p.vy=-.1;p.r=2.5;p.life=p.max=3+r()}
  else if(type==='dust'){p.z=2;p.vz=6+r()*6;p.vx=(r()-.5)*.6;p.vy=(r()-.5)*.6;p.r=2+r()*3;p.life=p.max=1+r()*.6}
  else if(type==='leaf'){p.z=16+r()*20;p.vz=-4;p.g=8;p.vx=(r()-.3)*.8;p.vy=(r()-.5)*.6;p.r=1.8+r();p.life=p.max=1.4+r();p.c=pick(G&&G.biome==='autumn'?BIO.leaves:BIO.pines)}
  else if(type==='pop'){p.z=10;p.vz=24+r()*10;p.vx=(r()-.5)*.8;p.vy=(r()-.5)*.8;p.life=p.max=.5}
  else if(type==='ring'){p.z=0;p.life=p.max=.6}
  else if(type==='chip'||type==='rockchip'||type==='debris'||type==='blood'||type==='spark'){p.z=8+r()*6;p.vz=20+r()*25;p.g=90;p.vx=(r()-.5)*1.6;p.vy=(r()-.5)*1.6;p.r=1.4+r();p.life=p.max=.6+r()*.4}
  else if(type==='fire'){p.z=6+r()*10;p.vz=18+r()*10;p.r=2+r()*2.5;p.life=p.max=.5+r()*.4}
  PT.push(p)}
function floater(x,y,text){PT.push({type:'txt',x,y,z:26,vz:16,vx:0,vy:0,life:1.5,max:1.5,text,g:0})}
function fishJump(x,y){PT.push({type:'fish',x,y,z:0,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,vz:0,life:.9,max:.9,g:0,c:Math.random()<.5});for(let k=0;k<4;k++)PT.push({type:'splash',x,y,z:1,vx:(Math.random()-.5),vy:(Math.random()-.5),vz:20+Math.random()*15,g:80,life:.5,max:.5,r:1.3})}
function updParticles(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.life-=dt;if(p.life<=0){PT.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.g){p.vz-=p.g*dt;if(p.z<0){p.z=0;p.vz*=-.3;p.vx*=.5;p.vy*=.5}}if(p.type==='smoke')p.r+=dt*3.5}
  for(let i=AR.length-1;i>=0;i--){const a=AR[i],t=UMAP.get(a.tid);if(!t){AR.splice(i,1);continue}const dx=t.x-a.x,dy=t.y-a.y,d=Math.hypot(dx,dy);a.ang=Math.atan2((dx+dy)*HH,(dx-dy)*HW);
    if(d<.3){dmgUnit(t,a.dmg);AR.splice(i,1);continue}const s=a.sp*dt;a.x+=dx/d*s;a.y+=dy/d*s;a.z=lerp(a.z,10,.1)}}

/* ================= Update ================= */
function update(dt){G.t+=dt;
  const pop=popCount();G.foodAcc=(G.foodAcc||0)+pop*dt/32;while(G.foodAcc>=1){G.foodAcc--;if(G.res.food>0)G.res.food--}
  // raids only once there is a real village to defend (Casa Comunal + inhabitants)
  if(settings.raids&&!G.demo&&longhouse()&&pop>0){if(!G.raidOn&&!G.raidWarned&&G.t>=G.nextRaid-25){G.raidWarned=true;toast('🔭 Invasores avistados! Chegam em 25 segundos.','bad')}
    if(G.t>=G.nextRaid&&!G.raidOn){G.raidWarned=false;G.nextRaid=G.t+260+Math.random()*90;spawnRaid()}}
  else G.nextRaid=Math.max(G.nextRaid,G.t+300);
  for(const u of G.units.slice()){if(!UMAP.has(u.id))continue;if(u.kind==='player')updPlayer(u,dt);else if(u.kind==='villager')updVillager(u,dt);else if(u.kind==='warrior')updWarrior(u,dt);else updRaider(u,dt);
    if(u.moving||(u.act&&u.act.type!=='idle'&&u.act.type!=='wait'))u.anim+=dt*10;if(u.swing>0)u.swing-=dt}
  for(const b of G.bld){if(b.pop>0)b.pop-=dt;if(!b.done)continue;
    if(b.type==='tower'){b.cd-=dt;if(b.cd<=0){const t=nearestUnit(b.x+.5,b.y+.5,6.5,v=>v.kind==='raider');if(t){b.cd=1.4;AR.push({x:b.x+.5,y:b.y+.5,z:46,tid:t.id,dmg:9,sp:10})}else b.cd=.3}}
    b.smokeT-=dt;if(b.smokeT<=0){b.smokeT=.6+Math.random()*.6;const c=chimney(b);if(c){puff(c[0],c[1],'chimney');const p=PT[PT.length-1];if(p)p.z=c[2]}}
    if(b.hp<b.max*.45&&Math.random()<dt*6)puff(b.x+Math.random()*b.w,b.y+Math.random()*b.h,Math.random()<.5?'fire':'smoke')}
  updFalling(dt);
  for(let k=G.regrow.length-1;k>=0;k--){const i=G.regrow[k],o=G.obj[i];if(!o||G.occ[i]){G.regrow.splice(k,1);continue}
    if(o.t==='stump'){o.timer-=dt;if(o.timer<=0)G.obj[i]={t:'tree',k:o.k,c:o.c,ox:o.ox,oy:o.oy,s:o.s,hp:5,g:.2}}
    else if(o.t==='tree'){o.g=Math.min(1,o.g+dt/150);if(o.g>=1)G.regrow.splice(k,1)}
    else if(o.t==='bush'){o.rt=(o.rt||0)+dt;if(o.rt>100){o.rt=0;o.b++}if(o.b>=3){o.tr=0;G.regrow.splice(k,1)}}
    else G.regrow.splice(k,1)}

function ghostTiles(){if(mode.t==='build'&&mode.has){const d=BD[mode.type];return[[mode.gx,mode.gy,d.w,d.h]]}
  if(mode.t==='line'&&mode.a)return lineTiles(mode.a,mode.b).map(([x,y])=>[x,y,1,1]);return[]}
// straight, vertical and diagonal (= screen-horizontal) lines

  if(!b.done){const me=PL();h+=`<p class="hint">${me&&me.act&&me.act.type==='build'&&me.act.b===b.id?'🔨 Você está construindo.':'Toque na obra para construir. '+(G.items.hammer?'':'Um 🔨 Martelo acelera.')}</p>`}
  else{
    if(d.store){const cap=storeCap();h+=`<table class="tbl">${Object.keys(RES).map(k=>`<tr><td>${RES[k][0]} ${RES[k][1]}</td><td>${G.res[k]} / ${cap}</td></tr>`).join('')}</table><p class="hint">Toque aqui para guardar o que estiver na mochila.</p>`}
    if(d.jobs)h+=`<p class="hint">👥 Posto para ${d.jobs} trabalhador(es). Moradores poderão ser encontrados no futuro.</p>`;
    if(b.type==='quarry')h+=`<div class="row"><b>Extrair:</b><button class="sbtn ${b.mode==='stone'?'on':''}" data-a="qmode" data-v="stone">🪨 Pedra</button><button class="sbtn ${b.mode==='iron'?'on':''}" data-a="qmode" data-v="iron">🔩 Ferro</button></div>`;
    if(b.type==='smithy')h+=`<p class="hint">Abra Criar para forjar armas. Você caminha até a ferraria para trabalhar.</p>`;
    if(b.type==='tower')h+=`<p class="hint">🏹 Alcance de 6 casas. Funciona sozinha.</p>`}
  h+=`<div class="row"><button class="sbtn red" data-a="demolish">🔨 Desmontar (devolve ${b.done?'metade':'80%'})</button></div>`;
  return h}
$('#sheet').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;act(el.dataset.a,el.dataset.v)});
function act(a,v){const b=sel&&sel.k==='b'?BMAP.get(sel.id):null;
  switch(a){
  case'close':closeSheet();sel=null;if(mode.t==='edit')mode={t:'none'};markTabs();break;
  case'cat':lastCat=v;sfx('tick');break;
  case'expand':expanded=!expanded;break;
  case'build':sfx('tick');enterBuild(v);return;
  case'decor':sfx('tick');enterDecor(v);return;
  case'qmode':if(b)b.mode=v;break;
  case'craft':{const it=ITEMS[v];if(!afford(it.cost)){toast('Faltam recursos','bad');break}
    if(it.hand){pay(it.cost);order({type:'craft',item:v,paid:it.cost})}else{const sm=G.bld.find(x=>x.type==='smithy'&&x.done);if(!sm){toast('Construa uma Ferraria primeiro','bad');break}pay(it.cost);order({type:'forge',b:sm.id,item:v,paid:it.cost});toast('Indo até a Ferraria…')}
    closeSheet();break}
  case'godeposit':{const me=PL();let best=null,bd=1e9;for(const s of G.bld)if(s.done&&BD[s.type].store){const d=Math.hypot(s.x-me.x,s.y-me.y);if(d<bd){bd=d;best=s}}if(best){order({type:'deposit',b:best.id});closeSheet()}break}
  case'demolish':if(b){refund(BD[b.type].cost,b.done?.5:.8);destroyB(b);closeSheet()}break;
  case'flip':if(mode.sel)mode.sel.f*=-1;break;
  case'big':if(mode.sel)mode.sel.s=Math.min(3,mode.sel.s*1.15);break;
  case'small':if(mode.sel)mode.sel.s=Math.max(.35,mode.sel.s/1.15);break;
  case'dup':if(mode.sel){const D=DECOR[mode.sel.k];if(!afford(D.cost)){toast('Faltam recursos','bad');break}pay(D.cost);const d={...mode.sel,id:G.idc++,x:mode.sel.x+.6,y:mode.sel.y+.3};G.decor.push(d);mode.sel=d;sfx('place')}break;
  case'del':if(mode.sel){refund(DECOR[mode.sel.k].cost,.5);G.decor.splice(G.decor.indexOf(mode.sel),1);mode.sel=null}break;
  case'done':mode={t:'none'};closeSheet();break}
  sheetSig='';renderSheet();markTabs()}
const TABS={build:['build','Construir'],craft:['craft','Criar'],bag:['bag','Mochila'],edit:['edit','Editar']};
document.querySelectorAll('#bar button').forEach(btn=>{const[ic,lb]=TABS[btn.dataset.tab];btn.innerHTML=svg(ic)+lb;btn.addEventListener('click',()=>{const t=btn.dataset.tab;sfx('tick');
  if(t==='edit'){if(mode.t==='edit'){mode={t:'none'};closeSheet()}else{$('#place').classList.remove('open');mode={t:'edit',sel:null};sel=null;openSheet('edit')}markTabs();return}
  if(t==='build'&&(mode.t==='build'||mode.t==='line'||mode.t==='decor')){if(sheetKind==='build')closeSheet();else{$('#place').classList.remove('open');openSheet('build')}return}
  if(mode.t!=='none')cancelMode();if(sheetKind===t){closeSheet();return}sel=null;openSheet(t)})});
$('#bLoc').innerHTML=svg('loc');$('#bMenu').innerHTML=svg('menu');

/* ================= HUD / toasts ================= */
let hudSig='';
function updHUD(){if(!G)return;const w=bagW();
  const h=Object.keys(RES).map(k=>`<div class="chip" title="${RES[k][1]}">${RES[k][0]} ${Math.floor(have(k))}</div>`).join('')+`<button class="chip bag ${w>=BAG?'full':''}" data-bag="1">🎒 ${w}/${BAG}</button>`;
  if(h!==hudSig){hudSig=h;$('#res').innerHTML=h}
  const r=G.units.filter(u=>u.kind==='raider').length,el=$('#raid');if(r){el.classList.remove('hidden');el.textContent=`⚔️ Invasão: ${r} · tocar para ver`}else el.classList.add('hidden');
  $('#bSpeed').textContent=paused?'⏸':G.speed+'×'}
$('#res').addEventListener('click',e=>{if(e.target.closest('[data-bag]')){if(sheetKind==='bag')closeSheet();else{if(mode.t!=='none')cancelMode();openSheet('bag')}}});
$('#raid').addEventListener('click',()=>{const r=G.units.find(u=>u.kind==='raider');if(r)focusOn(r.x,r.y)});
$('#bLoc').addEventListener('click',()=>{const p=PL();if(p)focusOn(p.x,p.y)});
function toggleSpeed(){if(paused){paused=false;G.speed=1}else if(G.speed>=3){paused=true}else G.speed++;updHUD()}
$('#bSpeed').addEventListener('click',toggleSpeed);
$('#bMenu').addEventListener('click',()=>openMenu(true));
function toast(msg,kind){if(G&&G.demo)return;const box=$('#toasts');for(const c of box.children)if(c.textContent===msg)return;const el=document.createElement('div');el.className='toast glass '+(kind||'');el.textContent=msg;box.appendChild(el);while(box.children.length>2)box.firstChild.remove();setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),400)},kind==='bad'?3800:3000)}
function centerOn(x,y){const q=P(x,y);cam.x=W/2-q[0]*cam.z;cam.y=H*.48-q[1]*cam.z}
function focusOn(x,y){const q=P(x,y);camGo={x:W/2-q[0]*cam.z,y:H*.48-q[1]*cam.z}}
function centerCam(){const p=PL();if(p)centerOn(p.x,p.y);else centerOn(G.start[0],G.start[1])}

/* ================= Audio (synthesized, lightweight) ================= */
const SND={ctx:null};
function audioInit(){if(SND.ctx||!settings.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC();SND.ctx=c;SND.master=c.createGain();SND.master.gain.value=.7;SND.master.connect(c.destination);
  const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5}SND.brown=buf;
  const wb=c.createBuffer(1,len,c.sampleRate),wd=wb.getChannelData(0);for(let i=0;i<len;i++)wd[i]=Math.random()*2-1;SND.white=wb;
  const src=c.createBufferSource();src.buffer=buf;src.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=500;const g=c.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(SND.master);src.start();SND.wind={g,f}}catch(e){SND.ctx=null}}
document.addEventListener('pointerdown',()=>{audioInit();if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume().catch(()=>{})},{passive:true});
function sfx(type){const c=SND.ctx;if(!c||!settings.sound||menuOpen)return;const t=c.currentTime;
  const env=(node,a,d,peak,st)=>{st=st||t;const g=c.createGain();g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(peak,st+a);g.gain.exponentialRampToValueAtTime(.0001,st+a+d);node.connect(g);g.connect(SND.master)};
  const osc=(ty,f0,f1,dur,peak,st)=>{st=st||t;const o=c.createOscillator();o.type=ty;o.frequency.setValueAtTime(f0,st);o.frequency.exponentialRampToValueAtTime(f1,st+dur);env(o,.005,dur,peak,st);o.start(st);o.stop(st+dur+.05)};
  const nz=(fq,dur,peak,q,buf)=>{const s=c.createBufferSource();s.buffer=buf||SND.white;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q||1;s.connect(f);env(f,.003,dur,peak);s.start(t,Math.random());s.stop(t+dur+.05)};
  switch(type){
   case'chop':nz(1100,.1,.35,1.4);osc('triangle',210,110,.08,.18);break;
   case'hammer':nz(2200,.05,.12,2);osc('triangle',380,260,.04,.06);break;
   case'pick':osc('sine',520,900,.08,.12);break;
   case'mine':nz(3000,.07,.25,3);osc('square',320,190,.04,.04);break;
   case'fall':nz(260,.7,.5,.7,SND.brown);osc('sine',90,36,.5,.35);break;
   case'place':osc('sine',150,70,.18,.28);nz(600,.12,.12,1,SND.brown);break;
   case'craft':osc('triangle',660,660,.07,.12);osc('triangle',990,990,.12,.1,t+.09);break;
   case'store':osc('sine',700,1050,.1,.1);osc('sine',1050,1400,.1,.07,t+.08);break;
   case'splash':nz(1500,.25,.22,.7);break;
   case'tick':osc('sine',1200,1000,.03,.04);break;
   case'bad':osc('sawtooth',200,140,.22,.05);break;
   case'bird':{const f=2300+Math.random()*1500,n=2+(Math.random()*3|0);for(let i=0;i<n;i++)osc('sine',f,f*1.3,.07,.025,t+i*.12)}break}}
function audioTick(dt){if(!SND.ctx||!SND.wind)return;const w=windStrength(),on=settings.sound&&!menuOpen&&G&&!G.demo;
  SND.wind.g.gain.setTargetAtTime(on?(.02+w*.045)*(BIO.snowy?1.6:1):0,SND.ctx.currentTime,.6);SND.wind.f.frequency.setTargetAtTime(280+w*480,SND.ctx.currentTime,.6);
  SND.birdT=(SND.birdT==null?3:SND.birdT)-dt;if(SND.birdT<=0){SND.birdT=4+Math.random()*9;if(on&&!BIO.snowy&&darkness()<.15)sfx('bird')}}

/* ================= Save / load ================= */
function save(silent){if(!G||G.demo)return;try{const s=JSON.stringify({v:2,biome:G.biome,seed:G.seed,tiles:Array.from(G.tiles),wear:Array.from(G.wear,v=>Math.round(v*10)/10),h:Array.from(G.h,v=>Math.round(v)),obj:G.obj,bld:G.bld.map(b=>({...b,pop:0})),units:G.units.map(u=>({...u,path:null,act:null,order:null,flee:false})),decor:G.decor,res:G.res,inv:G.inv,items:G.items,t:G.t,speed:G.speed,idc:G.idc,nextRaid:isFinite(G.nextRaid)?G.nextRaid:1e12,raidN:G.raidN,raidOn:G.raidOn,regrow:G.regrow,fall:G.fall,hints:G.hints,flags:G.flags,pid:G.pid,start:G.start,cam});
  localStorage.setItem(SAVE_KEY,s);if(!silent)toast('💾 Jogo salvo neste navegador','good')}catch(e){if(!silent)toast('Não foi possível salvar neste navegador','bad')}}
function hasSave(){try{return!!localStorage.getItem(SAVE_KEY)}catch(e){return false}}
function load(){let s;try{s=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){s=null}if(!s){toast('Nenhum jogo salvo encontrado','bad');return false}
  BIO=BIOMES[s.biome];G={biome:s.biome,seed:s.seed,tiles:Uint8Array.from(s.tiles),wear:Float32Array.from(s.wear),h:Float32Array.from(s.h),obj:s.obj,occ:new Int32Array(N*N),bld:s.bld,units:s.units,decor:s.decor||[],res:s.res,inv:s.inv,items:s.items,t:s.t,speed:s.speed||1,idc:s.idc,nextRaid:s.nextRaid,raidN:s.raidN||0,raidOn:s.raidOn,regrow:s.regrow||[],fall:s.fall||[],hints:s.hints||{},flags:s.flags||{},pid:s.pid,start:s.start,demo:false};
  BMAP=new Map();UMAP=new Map();for(const b of G.bld){BMAP.set(b.id,b);for(let dy=0;dy<b.h;dy++)for(let dx=0;dx<b.w;dx++)G.occ[idx(b.x+dx,b.y+dy)]=b.id}
  for(const u of G.units)UMAP.set(u.id,u);if(!G.units.some(u=>u.kind==='raider'))G.raidOn=false;
  if(!PL()){const p=spawnUnit('player',G.start[0]+.5,G.start[1]+.5,playerLook());G.pid=p.id}
  PT=[];AR=[];initTiles();bgGrad=null;initWeather();makeThumbs();if(s.cam)cam=s.cam;else centerCam();return true}

/* ================= Game setup ================= */
const playerLook=()=>({name:'Você',tunic:'#2f5fa8',hair:'#d9a84e',skin:'#f1c9a0',fem:false,hp:100,max:100,speed:2,ox:0,oy:0});
function newGame(biome,seed,demo){BIO=BIOMES[biome];
  G={biome,seed:seed||((Math.random()*1e9)|0),tiles:new Uint8Array(N*N),wear:new Float32Array(N*N),h:new Float32Array(N*N),obj:new Array(N*N).fill(null),occ:new Int32Array(N*N),bld:[],units:[],decor:[],
    res:{stick:0,wood:0,stone:0,food:0,iron:0},inv:{stick:0,wood:0,stone:0,food:0,iron:0},items:{axe:0,pick:0,hammer:0,rod:0,sickle:0,sword:0,shield:0,spear:0,bow:0},
    t:185,speed:1,idc:1,nextRaid:1e12,raidN:0,raidOn:false,regrow:[],fall:[],hints:{},flags:{},demo:!!demo};
  BMAP=new Map();UMAP=new Map();PT=[];AR=[];genMap();
  const p=spawnUnit('player',G.start[0]+.5,G.start[1]+.5,playerLook());G.pid=p.id;
  initTiles();bgGrad=null;initWeather();makeThumbs();cam.z=isTouch?1.2:1.3;centerCam()}
function openMenu(inGame){menuOpen=true;$('#menu').classList.remove('hidden');$('#hud').classList.add('hidden');
  const top=$('#mTop');top.innerHTML=(inGame?'<button class="gbtn" id="mResume">▶ Voltar ao jogo</button><button class="sbtn" id="mSave">💾 Salvar</button>':'')+(hasSave()?'<button class="'+(inGame?'sbtn':'gbtn')+'" id="mLoad">📂 '+(inGame?'Carregar salvo':'Continuar jogo salvo')+'</button>':'');
  if(inGame){$('#mResume').onclick=closeMenu;$('#mSave').onclick=()=>{save();openMenu(true)}}
  const ml=$('#mLoad');if(ml)ml.onclick=()=>{if(load())closeMenu()};
  $('#biomes').innerHTML=Object.keys(BIOMES).map(k=>`<button class="bcard" data-b="${k}" style="background:${BIOMES[k].card}"><b>${BIOMES[k].name}</b><span>${BIOMES[k].desc}</span></button>`).join('');
  document.querySelectorAll('.bcard').forEach(el=>el.onclick=()=>{newGame(el.dataset.b);closeMenu()});
  const opt=[['sound','Sons','Vento, pássaros e ações'],['raids','Invasões','Só depois de ter Casa Comunal e moradores'],['daynight','Dia e noite','Ciclo de luz com fogueiras acesas'],['tilt','Efeito miniatura','Desfoque tilt-shift nas bordas (pesa em celulares)']];
  $('#opts').innerHTML=opt.map(([k,n,s])=>`<div class="tg"><div>${n}<small>${s}</small></div><button class="sw ${settings[k]?'on':''}" data-o="${k}"></button></div>`).join('');
  document.querySelectorAll('.sw').forEach(el=>el.onclick=()=>{const k=el.dataset.o;settings[k]=!settings[k];el.classList.toggle('on',settings[k]);saveSettings();applySettings()})}
function closeMenu(){menuOpen=false;$('#menu').classList.add('hidden');$('#hud').classList.remove('hidden');hudSig='';updHUD();mode={t:'none'};sel=null;closeSheet();$('#place').classList.remove('open');audioInit()}
function applySettings(){document.body.classList.toggle('tilt-on',!!settings.tilt)}

/* ================= Loop ================= */
let last=performance.now(),uiT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;perfT=now/1000;
  if(G&&!(paused&&!G.demo)&&!(menuOpen&&!G.demo)){const steps=G.demo?1:G.speed;for(let i=0;i<steps;i++)update(dt)}
  if(zT){const f=Math.pow(zT.z/cam.z,Math.min(1,dt*12));zoomAt(zT.px,zT.py,f);if(Math.abs(zT.z-cam.z)<.002)zT=null}
  if(camGo){const k=Math.min(1,dt*6);cam.x+=(camGo.x-cam.x)*k;cam.y+=(camGo.y-cam.y)*k;if(Math.abs(camGo.x-cam.x)+Math.abs(camGo.y-cam.y)<1)camGo=null}
  else if(G&&!menuOpen&&!ptrs.size){const p=PL();if(p&&p.moving){const[sx,sy]=w2s(p.x,p.y);const mx=W*.18,mt=H*.22,mb=H*.3;let dx=0,dy=0;if(sx<mx)dx=mx-sx;else if(sx>W-mx)dx=W-mx-sx;if(sy<mt)dy=mt-sy;else if(sy>H-mb)dy=H-mb-sy;const k=Math.min(1,dt*3);cam.x+=dx*k;cam.y+=dy*k}}
  updWeather(dt);render();audioTick(dt);
  uiT-=dt;if(uiT<=0&&!menuOpen){uiT=.25;updHUD();renderSheet();hintChecks()}
  requestAnimationFrame(frame)}
applySettings();
newGame(pick(Object.keys(BIOMES)),null,true);cam.z=isTouch?.95:1.1;centerCam();
openMenu(false);
requestAnimationFrame(frame);
</script>
