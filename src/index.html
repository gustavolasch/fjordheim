<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vikings Game — Construa sua vila viking</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fjordheim">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<!--@css-->
</head>
<body>
<canvas id="c"></canvas>
<div id="tiltB" class="tilt"></div>
<div id="vig"></div>
<div id="hud" class="hidden">
  <div id="season" class="glass"></div>
  <div id="top"><div id="res" class="glass"></div><button id="bLoc" class="rbtn glass" title="Encontrar personagem"></button><button id="bMenu" class="rbtn glass" title="Menu"></button></div>
  <div id="hint" class="glass off"><span class="ic">💡</span><span id="hintT"></span><button id="hintX" aria-label="Dispensar">✕</button></div>
  <div id="raid" class="hidden"></div>
  <div id="toasts"></div>
  <button id="bDismount" class="sbtn hidden" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:8;box-shadow:0 2px 10px rgba(0,0,0,.35)">Sair da carroça</button>
  <div id="sheet" class="glass"></div>
  <div id="place" class="glass"></div>
  <nav id="bar" class="glass">
    <button data-tab="build"></button>
    <button data-tab="craft"></button>
    <button data-tab="bag"></button>
    <button data-tab="edit"></button>
  </nav>
</div>
<div id="menu">
  <div class="mbox panel">
    <h1>FJORDHEIM</h1>
    <p class="sub">Comece do nada. Construa tudo.</p>
    <div class="mrow" id="mTop"></div>
    <div class="joinbox hidden" id="joinBox"><input id="joinCode" maxlength="5" placeholder="Código" autocapitalize="characters" autocomplete="off"><button class="gbtn" id="joinGo">Entrar</button></div>
    <div class="guia hidden" id="guia"></div>
    <div class="transfer hidden" id="transfer">
      <p>Exportar este mundo</p>
      <div class="mrow"><button class="sbtn" id="trFile">📤 Salvar arquivo</button><button class="sbtn" id="trCopy">📋 Copiar código</button></div>
      <p>Importar um mundo</p>
      <div class="mrow"><button class="sbtn" id="trPick">📥 Escolher arquivo</button><button class="sbtn" id="trPaste">Importar código</button></div>
      <textarea id="trText" rows="3" placeholder="Cole aqui o código do mundo" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      <input type="file" id="trInput" hidden>
      <p id="trMsg" role="status"></p>
    </div>
    <div id="newSec"><h3>Novo jogo · escolha o cenário</h3>
    <div class="bgrid" id="biomes"></div></div>
    <h3>Opções</h3>
    <div class="opts" id="opts"></div>
    <p class="ver">__VER__</p>
    <p class="help">Toque no chão para andar e nos objetos para coletar · arraste para mover a câmera · pinça ou roda do mouse para zoom</p>
  </div>
</div>
<!--@js-->
</body>
</html>
